.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);text-align:left;width:100%;min-height:48px}

const ddt = () => S.ddts.find(d => d.id===S.lastDdt);
const dsort = s => s.split("/").reverse().join("");

/* ===== Abbinamento automatico delle letture agli ordini fornitore (70, 183, 184) ===== */
function candidates(d, a){
  const out=[];
  for(const [k,o] of Object.entries(S.ofs)){ if(o.forn!==d.forn) continue;
    o.righe.forEach((r,ri)=>{ if(r.a===a && r.ric<r.q) out.push({of:k, ri, o, r, res:r.q-r.ric}); }); }
  return out.sort((x,y)=> ((y.of===d.ofCit)-(x.of===d.ofCit)) || ((!!y.o.cli)-(!!x.o.cli)) || dsort(x.o.data).localeCompare(dsort(y.o.data)));
}
function ofLine(l){ const o=S.ofs[l.of]; return o ? o.righe.find(r=>r.a===l.a) : null; }
function register(a, q, how, ofKey){
  const d=ddt(); const c = candidates(d,a); let pick = ofKey ? c.find(x=>x.of===ofKey) : c[0];
  if(!pick && ofKey){ const o=S.ofs[ofKey]; const r=o&&o.righe.find(r=>r.a===a); if(r) pick={of:ofKey, r, o}; }
  if(!pick) return false;
  let l = d.lines.find(x=>x.a===a && x.of===pick.of); if(!l){ l={a, of:pick.of, cnt:0}; d.lines.push(l); }
  l.cnt+=q; l.lastQ=q; pick.r.ric+=q; if(!d.who) d.who=me();
  const e=S.area.find(x=>x.a===a && x.from==="DDT "+d.num); e? e.q+=q : S.area.push({a,q,from:"DDT "+d.num, forn:d.forn});
  S.toast = {kind:"scan", txt:`♪ Registrati ${q} ${A(a).unit} · ${A(a).code} su ${pick.of}${pick.o.cli?" (per "+pick.o.cli+")":""}`, a, of:pick.of, q};
  log(`+${q} ${A(a).code} (${how}) su ${pick.of}`, "DDT "+d.num);
  if(pick.r.ric>pick.r.q) S.controlli.push({id:"c"+(++S.n), t:"ecc", a, txt:`Eccedenza: ${pick.r.ric} ${A(a).code} su ${pick.r.q} ordinati (${pick.of}, DDT ${d.num})`});
  if(!S.online) S.pendingOffline++;
  return true;
}
function undoScan(t){ const d=ddt(); const l=d.lines.find(x=>x.a===t.a && x.of===t.of); if(!l) return; l.cnt-=t.q; const r=ofLine(l); if(r) r.ric-=t.q;
  const e=S.area.find(z=>z.a===t.a && z.from==="DDT "+d.num); if(e){ e.q-=t.q; if(e.q<=0) S.area.splice(S.area.indexOf(e),1); }
  if(l.cnt<=0 && !l.ferma) d.lines.splice(d.lines.indexOf(l),1);
  log(`Annulla: −${t.q} ${A(t.a).code} (correzione collegata alla scansione, niente si cancella)`, "DDT "+d.num); }

/* Cose in sospeso (187): quattro gruppi, dal più vecchio. Ogni voce: {l, r, cls, act, small, who, age, ferma, old} */
function sospesi(items, empty){
  const g = {fermi:[], vecchi:[], miei:[], altri:[]};
  items.forEach(x => (x.ferma ? g.fermi : x.old ? g.vecchi : x.who===me() ? g.miei : g.altri).push(x));
  const blk = (t, arr) => arr.length ? `<div class="grp-h"><span>${t}</span><span>${arr.length}</span></div><div class="list">${arr.map(x=>row(x.l, x.r, x.cls||"", x.act||"", x.small||"")).join("")}</div>` : "";
  const out = blk("I miei, in corso", g.miei) + blk("Di colleghi", g.altri) + blk("Fermi", g.fermi) + blk("Vecchi, oltre 2 giorni", g.vecchi);
  return `<h2>In sospeso</h2>` + (out || `<p class="muted">${empty}</p>`);
}

    <div class="list">${arts.map(k=>pick(k,"manoArt:"+k,`<small>${candidates(d,k).length} ordini aperti</small>`)).join("")}</div>
    <p class="muted">Qui ci sono solo gli articoli che ${esc(d.forn)} deve ancora mandare. Per gli altri: «Articolo nuovo» o merce non prevista.</p>`; }
  if(tab==="art"){ const c=candidates(d,a);
    return `<h3>${A(a).code} · in quale ordine?</h3>${tabs}<p class="muted">${esc(A(a).desc)} è in ${c.length} ordini aperti, nell'ordine in cui li sceglierei io.</p>
    <div class="list">${c.map((x,j)=>row(`${x.of} del ${x.o.data.slice(0,5)}${x.o.cli?" · per "+esc(x.o.cli):""}`,`mancano ${x.res}`, j===0?"boss":"", `qtyA:${a}:${x.of.replace(" ","_")}`, j===0?"proposto":"")).join("")}</div>

    ${S.manoBc?`<div class="warnbox boss">La scatola aveva un barcode che non ho riconosciuto: alla registrazione propongo di collegarlo a ${A(a).code} (92).</div>`:""}`; }
  if(!of){ const ofs=Object.entries(S.ofs).filter(([k,o])=>o.forn===d.forn && o.righe.some(r=>r.ric<r.q)).sort((x,y)=>dsort(x[1].data).localeCompare(dsort(y[1].data)));

  const o=S.ofs[of];

  <p class="muted">Tocca l'articolo, poi scrivi o leggi la quantità. Nessun «prendi tutto l'ordine» (186).</p>`; };

/* ===== Chiudi DDT: riepilogo con le conseguenze (190) ===== */
V.chiudi = () => { const d=ddt(); const ferme=d.lines.filter(l=>l.ferma), pronte=d.lines.filter(l=>!l.ferma);
  const mancanti = Object.entries(S.ofs).filter(([k,o])=>o.forn===d.forn).flatMap(([k,o])=>o.righe.filter(r=>r.ric<r.q).map(r=>({k,r})));
  const diffB = pronte.filter(l=>l.bolla!==undefined && l.bolla!==l.cnt);
  const dm = S.dmgList.filter(x=>x.ddt===d.num);
  return `${hdr(`Chiudi DDT ${esc(d.num)}?`, esc(d.forn))}<main class="main">
  ${d.foto?photo("bolla del DDT "+d.num):`<div class="warnbox">Questo DDT non ha la foto della bolla.</div>`}
  <p class="muted">Guarda la bolla: tocca una riga solo se la bolla dice un'altra quantità (192). Anche un articolo atteso e non arrivato, se la bolla lo porta.</p>
  <h2>Righe pronte · contati e in bolla</h2><div class="list">${pronte.map(l=>{ const i=d.lines.indexOf(l), r=ofLine(l);
    const diff = l.bolla!==undefined && l.bolla!==l.cnt;
    return row(`${A(l.a).code} · ${l.of}`, `${l.cnt}`, diff?"part":"done", "sheet:bolla:"+i, `ordinati ${r?r.q:"?"} · in bolla ${l.bolla===undefined?"come contati":l.bolla}${diff?" · differenza al responsabile":""}`); }).join("") || `<p class="muted">Nessuna riga pronta.</p>`}</div>
  ${ferme.length?`<h2>Righe ferme</h2><div class="list">${ferme.map(l=>row(`${A(l.a).code}`, `${l.cnt}`, "halt", "", esc(l.ferma))).join("")}</div>`:""}
  ${dm.length?`<h2>Danneggiati</h2><div class="list">${dm.map(x=>row(A(x.a).code,`${x.q}`,"halt","","al responsabile")).join("")}</div>`:""}
  ${(d.nonArr||[]).length?`<h2>In bolla ma non arrivati</h2><div class="list">${d.nonArr.map(x=>row(esc(x.code),`0 di ${x.q}`,"halt","",`${x.of} · in bolla ${x.q}, contati 0: al responsabile`)).join("")}</div>`:""}
  <details class="exp"><summary>Ancora attesi da ${esc(d.forn)}: ${mancanti.length} righe</summary><div class="list">${mancanti.map(x=>row(x.r.a?A(x.r.a).code:esc(x.r.code), `mancano ${x.r.q-x.r.ric}`, "", `sheet:nonArr:${x.k.replace(" ","_")}:${x.r.a||x.r.code}`, `${x.k} · tocca se la bolla lo porta`)).join("")}</div><p class="muted">Restano aperte negli ordini: le chiude solo il responsabile (33).</p></details>
  <div class="card"><b>Cosa succede se chiudi</b><ul class="muted" style="margin:0;padding-left:20px;display:grid;gap:4px">
    <li>Al gestionale va un carico con ${pronte.length} righe.</li>
    ${ferme.length?`<li>${ferme.length} riga ferma avrà poi un carico suo, quando decide il responsabile (82).</li>`:""}
    ${diffB.length+(d.nonArr||[]).length?`<li>${diffB.length+(d.nonArr||[]).length} differenze con la bolla vanno al responsabile.</li>`:""}
    <li>Il DDT non si riapre: dopo, corregge solo il responsabile (81).</li></ul></div>
  <div class="btns two"><button class="btn" data-act="back">Torna al DDT</button><button class="btn go" data-act="chiudiOk" ${pronte.length?"":"disabled"}>${ferme.length?"Chiudi con le righe pronte":"Chiudi DDT"}</button></div>
  </main>`; };
function closeDdt(){ const d=ddt(); d.open=false; d.chiuso="18/11 "+clock();
  d.lines.filter(l=>!l.ferma && l.bolla!==undefined && l.bolla!==l.cnt).forEach(l=>S.controlli.push({id:"c"+(++S.n), t:"bolla", a:l.a, txt:`Differenza con la bolla: ${A(l.a).code} contati ${l.cnt}, in bolla ${l.bolla} (DDT ${d.num})`}));
  (d.nonArr||[]).forEach(x=>S.controlli.push({id:"c"+(++S.n), t:"bolla", a:x.a||null, txt:`In bolla ma non arrivati: ${x.q} ${x.code} (${x.of}, DDT ${d.num})`}));
  log(`Chiude il DDT ${d.num}: un carico al gestionale`+(d.lines.some(l=>l.ferma)?"; la riga ferma avrà un carico suo":""), "DDT "+d.num);
  S.coda_out.unshift({txt:`Carico del DDT ${d.num}`, stato: S.online?"inviato":"in coda"}); }

/* ===== Articolo nuovo ===== */
V.nuovo = () => {
  const N = S.newArt, d = ddt();
  const steps = `<div class="steps">${[0,1,2,3].map(s=>`<i class="${s<=N.step?"on":""}"></i>`).join("")}</div>`;
  if(N.step===0){
    const righe = Object.entries(S.ofs).filter(([k,o])=>o.forn===d.forn).flatMap(([k,o])=>o.righe.map((r,ri)=>({k,r,ri}))).filter(x=>!x.r.a);
    return `${hdr("Articolo nuovo","Prima le righe che lo aspettano")}<main class="main">${steps}
      <p class="muted">Negli ordini di ${esc(d.forn)} ci sono righe senza articolo a catalogo. Se la scatola è una di queste, codice e descrizione sono già pronti.</p>
      <div class="list">${righe.map(x=>row(`${esc(x.r.code)} · ${esc(x.r.desc)}`,`${x.r.q} attesi`,"part",`nuovo:of:${x.k.replace(" ","_")}:${x.ri}`,x.k)).join("")}</div>
      <button class="btn" data-act="nuovo:libero">Nessuna di queste</button></main>`;
  }
  if(N.step===1){
    const shots=["davanti","etichetta con il codice","un altro lato"];
    return `${hdr(N.agg?"Aggiungi foto":"Articolo nuovo","Tre foto guidate")}<main class="main">${steps}
      <div class="cam"><div class="frame big">Foto ${Math.min(N.shots+1,3)} di 3: ${shots[Math.min(N.shots,2)]}<br>metti la scatola nel riquadro</div></div>
      ${N.blur?`<div class="warnbox">La foto è mossa: rifalla tenendo fermo il telefono.</div>`:""}
      <div class="btns two"><button class="btn" data-act="shotBlur">Scatta (esce mossa)</button><button class="btn go" data-act="shot">Scatta</button></div>
      ${N.shots>=1?`<button class="btn" data-act="shotsDone">${N.shots>=3?"Avanti":"Salta le altre e vai avanti"}</button>`:`<p class="muted">La prima foto è obbligatoria.</p>`}
      <div class="chips">${shots.map((s,i)=>`<span class="tag ${i<N.shots?"ok":""}">${i<N.shots?"✓ ":""}${s}</span>`).join("")}</div></main>`;
  }
  if(N.agg) return `${hdr("Aggiungi foto",N.code)}<main class="main"><div class="warnbox ok">${N.shots} foto aggiunte a ${esc(N.code)}. Diventano foto di riferimento con le loro regole.</div><button class="btn go" data-act="back">Fatto</button></main>`;
  if(N.step===2){
    const words=["Valvola","sfera","3/4\"","leva","gialla","ottone","PN25"];
    return `${hdr("Articolo nuovo","Dati")}<main class="main">${steps}
      <div class="field"><label for="nc">Codice letto dalla foto (correggibile)</label><input id="nc" type="text" value="${esc(N.code)}"></div>
      <div class="field"><label for="nd">Descrizione</label><input id="nd" type="text" value="${esc(N.desc)}"></div>
      <p class="muted">Parole lette sull'etichetta, tocca per aggiungerle:</p>
      <div class="chips">${words.map(w=>`<button class="chip" data-act="word:${esc(w)}">${esc(w)}</button>`).join("")}</div>
      <div class="field"><label for="nu">Unità di magazzino</label><select id="nu"><option selected>pezzo</option><option>metro</option><option>chilo</option></select></div>
      <p class="muted">Fornitore: ${esc(d.forn)} (dal DDT). Ubicazione abituale, prezzi e «si tiene a magazzino» li completa il responsabile.</p>
      <button class="btn go" data-act="datiOk">Avanti</button></main>`;
  }
  return `${hdr("Articolo nuovo","Prima di salvare")}<main class="main">${steps}
    <h3 style="margin:0">È uno di questi?</h3><p class="muted">Ho cercato in tutto il catalogo con codice, descrizione e aspetto.</p>
    <div class="list">${pick("V12","simile:V12")}${pick("V13","simile:V13")}</div>
    <button class="btn go" data-act="salvaNuovo">No, è un articolo nuovo</button>
    <p class="muted">Se ne scegli uno non creo niente: foto e codice nuovo si collegano a quell'articolo, da confermare.</p></main>`;
};

function catItems(c){
  if(c==="ddt") return S.ddts.map(d=>({doc:"DDT "+d.num, l:`DDT ${esc(d.num)} · ${esc(d.forn)}`, r:d.open?"aperto":"chiuso", small:`del ${d.data}${d.foto?" · foto della bolla":""}`, cls:d.open?"part":"done"}));
  if(c==="prep") return Object.entries(S.ordini).filter(([k,o])=>o.stato!=="aperto").map(([k,o])=>({doc:"Ordine "+k, l:`Ordine ${k} · ${esc(o.cli)}`, r:o.stato, small:`${o.colli} colli · preparato da ${o.prep}`, cls:"done"}));
  if(c==="sped") return S.ritiri.map(x=>({doc:x.id, l:`${S.cour[x.cour]} · ${x.day}`, r:`${x.ord.length} ordini`, small:`segnati da ${x.who}: ${x.ord.join(", ")}`, cls:"done"}));
  if(c==="vend") return S.venduteOk.map(v=>({doc:"Vendita "+v.id, l:`Vendita ${v.id} · ${esc(v.cli)}`, r:`${v.righe.length} articoli`, small:`${v.who}, ${v.at}`, cls:"done"}));
  if(c==="corr") return S.log.filter(e=>/Conteggio|Annulla|Correzione|danneggiat/i.test(e.txt)).map(e=>({doc:null, l:esc(e.txt), r:e.at, small:e.who}));
  return S.coda_out.map(x=>({doc:null, l:esc(x.txt), r:x.stato, cls:x.stato==="inviato"?"done":"part"}));
}

      ${isBoss()?`<div class="chips">${people.map(p=>`<button class="chip" data-act="regWho:${p}" aria-pressed="${S.regWho===p}" style="${S.regWho===p?"border:2px solid var(--ink)":""}">${esc(p)}</button>`).join("")}</div><p class="muted">Tutte le operazioni, con chi, quando, da quale telefono ed esito. Filtri anche per articolo e dispositivo (non nel prototipo).</p>`:`<p class="muted">Le tue operazioni. Il registro di tutti lo vede il responsabile.</p>`}

  if(S.docCat){ const its=catItems(S.docCat);

      <div class="field"><label for="dq3">Cerca numero, articolo, cliente</label><input id="dq3" type="text"></div>
      <div class="list">${its.map(x=>row(x.l,x.r,x.cls||"",x.doc?"doc:"+x.doc.replace(/ /g,"_"):"",x.small||"")).join("") || `<p class="muted">Ancora nessun documento.</p>`}</div>

  return `${hdr("Documenti","Storico per categoria")}<main class="main">${tabs}

const cop = o => { const t=o.righe.reduce((n,r)=>n+r.q,0), a=o.righe.reduce((n,r)=>n+r.ass,0); return a>=t?["completo","done"]:a>0?[`${a} di ${t}`,"part"]:["niente","dim"]; };
const ordRow = (k, act=true) => { const o=S.ordini[k]; const [t,c]=cop(o);
  if(o.stato!=="aperto") return row(`${k} · ${esc(o.cli)}`, o.stato==="pronto"?"pronto":"spedito", "done");
  if(o.da && o.da!==me()) return row(`${k} · ${esc(o.cli)}`, `in preparazione da ${o.da}`, "dim", "", `da ${o.age||"poco"}`);
  return row(`${k} · ${esc(o.cli)}`, t, c, act&&c!=="dim"?"ord:"+k:"", `${S.cour[o.cour]}${o.da===me()?" · lo stai preparando tu":""}`); };
function prepSospesi(filter){ const items = Object.entries(S.ordini).filter(([k,o])=>o.stato==="aperto" && o.da && filter(o)).map(([k,o])=>({l:`${k} · ${esc(o.cli)}`, r:o.da===me()?"riprendi":o.da, cls:o.ferma?"halt":o.old?"dim":"part", act:o.da===me()?"ord:"+k:"", small:o.ferma?`fermo: ${esc(o.ferma)}`:o.da===me()?`preso da te ${o.age?o.age+" fa":"ora"}`:`preso da ${o.da} da ${o.age||"poco"}${o.old?" · chi pianifica lo può liberare":""}`, who:o.da, ferma:!!o.ferma, old:o.old}));
  return sospesi(items, "Nessun ordine preso e non finito."); }

  if(S.coda){ const q=Object.entries(S.ordini).filter(([k,o])=>o.shop&&o.stato==="aperto"&&!o.da);
    return `${hdr("Preleva","Coda degli ordini del sito")}<main class="main">${prepSospesi(o=>o.shop)}
    <h2>In coda</h2><div class="tile"><b>${q.length}</b><span>ordini pronti da prelevare</span></div>
    ${q.length?`<button class="btn go" data-act="prossimo">Prossimo ordine</button>`:`<p class="muted">La coda è vuota: nessun ordine pagato da preparare.</p>`}
    <p class="muted">Ti do l'ordine pronto più vecchio. Chi lo prende lo toglie dalla coda: nessun altro lo vede.</p></main>`; }
  const mine=S.piani.filter(p=>p.prep===me()), others=S.piani.filter(p=>p.prep!==me());
  const pr = p => row(`Piano «${esc(p.t)}»`, `${p.ord.filter(k=>S.ordini[k].stato==="aperto").length} da fare`, p.prep===me()?"boss":"", "piano:"+p.id, `${p.ord.length} ordini · ${p.prep}`);
  return `${hdr("Preleva","Piani di spedizione")}<main class="main">${prepSospesi(o=>!o.shop)}
    <h2>I tuoi piani</h2><div class="list">${mine.map(pr).join("") || `<p class="muted">Nessun piano dato a te.</p>`}</div>
    <h2>Piani dei colleghi</h2><div class="list">${others.map(pr).join("") || `<p class="muted">Nessun piano dei colleghi.</p>`}</div>
    <p class="muted">Puoi aiutare un collega prendendo un suo ordine non ancora aperto.</p></main>`; };
V.piano = () => { const p=S.piani.find(x=>x.id===S.pianoSel);
  return `${hdr(`Piano «${esc(p.t)}»`,`di ${p.prep}`)}<main class="main"><div class="list">${p.ord.map(k=>ordRow(k)).join("")}</div>
  <p class="muted">Tocca un ordine per iniziare. Chi lo apre lo prende; uscendo a metà resta tuo, tra le cose in sospeso.</p></main>`; };
function pickRows(o){ return o.righe.map((r,i)=>({...r,i})).filter(r=>r.ass>0).sort((x,y)=>(x.vend||A(x.a).loc).localeCompare(y.vend||A(y.a).loc)); }
V.pick = () => { const k=S.ordine, o=S.ordini[k], rows=pickRows(o), P=S.pk; const r=rows[P.n];
  if(!r) return V.fine();
  const where = r.vend || A(r.a).loc;
  const stepTxt = P.st===0?`Vai a <b>${where}</b> e scansiona l'ubicazione`:P.st===1?`Inquadra la scatola di <b>${A(r.a).code}</b>`:`Quanti ne prendi?`;
  return `${hdr(`Ordine ${k}`,`${esc(o.cli)} · riga ${P.n+1} di ${rows.length}`)}<main class="main">
    ${toastHtml()}
    <div class="row boss"><span class="l"><span>${A(r.a).code} · ${esc(A(r.a).desc)}</span><small>${r.ass<r.q?`prendi ${r.ass} di ${r.q}: il resto non c'è ancora`:`prendi ${r.ass} ${A(r.a).unit}`}${r.vend?" · merce venduta, nel suo posto VEND":""}</small></span><span class="r">${where}</span></div>

V.spedisci = () => { const by={}; Object.entries(S.ordini).filter(([k,o])=>o.stato==="pronto").forEach(([k,o])=>{(by[o.cour]=by[o.cour]||[]).push(k);});
  S.resta = S.resta || {};

    <button class="btn go" data-act="sheet:ritiro:${c}" ${go.length?"":"disabled"}>Ritirato da ${S.cour[c]} (${go.length})</button>`; }).join(""):`<p class="muted">Nessun ordine pronto da spedire.</p>`}

SH.ritiro = ({i}) => { const c=["BRT","GLS"][i]||i; const ks=Object.keys(S.ordini).filter(k=>S.ordini[k].stato==="pronto"&&S.ordini[k].cour===c&&!(S.resta||{})[k]); const rest=Object.keys(S.ordini).filter(k=>S.ordini[k].stato==="pronto"&&S.ordini[k].cour===c&&(S.resta||{})[k]);
  return `<h3>Ritirato da ${S.cour[c]}?</h3><div class="list">${ks.map(k=>row(`${k} · ${esc(S.ordini[k].cli)}`,`${S.ordini[k].colli} colli`,"done")).join("")}</div>
  <p class="muted">Segno spediti ${ks.length} ordini, ${ks.reduce((n,k)=>n+(+S.ordini[k].colli||0),0)} colli. ${rest.length?`Restano pronti: ${rest.join(", ")}.`:""} La spedizione va al gestionale${S.coda?" e a Shopify":""}. Un errore lo corregge il responsabile.</p>
  <div class="btns two"><button class="btn" data-act="closeSheet">Torna indietro</button><button class="btn go" data-act="ritirato:${c}">Ritirato da ${S.cour[c]}</button></div>`; };
V.piani = () => `${hdr("Piani di spedizione","Chi pianifica")}<main class="main"><div class="list">${S.piani.map(p=>row(`«${esc(p.t)}»`,p.prep,"","",`${p.ord.join(", ")}`)).join("")}</div>
  <button class="btn go" data-act="go:nuovoPiano">Nuovo piano</button></main>`;
V.nuovoPiano = () => { const liberi=Object.keys(S.ordini).filter(k=>!S.ordini[k].shop && S.ordini[k].stato==="aperto" && !S.piani.some(p=>p.ord.includes(k)));

/* ===== Disegno ===== */
function render(){
  const app = document.getElementById("app");
  const view = (V[S.screen]||V.home)();
  const offline = !S.online ? `<div class="banner bad">Rete assente: il lavoro è fermo. ${S.pendingOffline} letture salvate sul telefono, partiranno appena torna la rete.</div>` : "";
  app.innerHTML = `<div class="proto"><span>PROTOTIPO · dati inventati${S.user?` · ${S.user.n}`:""}</span><button data-act="go:scenari">Scenari</button></div>${offline}${view}
    <details class="log"><summary>Tutto quello che è successo, per chi prova (${S.log.length})</summary><ol>${S.log.slice(0,30).map(e=>`<li>${e.at} · ${esc(e.who)}: ${esc(e.txt)}</li>`).join("")}</ol></details>
    ${S.sheet?`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${(h=>/data-act="(closeSheet|home|back)"/.test(h)?h:h+`<button class="btn" data-act="closeSheet">Annulla</button>`)(SH[S.sheet.sk](S.sheet))}</div></div>`:""}`;
}

/* ===== Azioni ===== */
function sheet(sk, extra={}){ S.sheet = Object.assign({}, extra, {sk}); render(); }
const ofk = s => s ? s.replace("_"," ") : s;
function act(a, el){
  const [c, x, y, ...rest] = a.split(":");
  switch(c){
    case "back": return back();
    case "home": S.stack=[]; return go("home", false);
    case "go": if(x==="chiudi"){ if(!ddt().lines.length){ S.toast={txt:"Il DDT non ha ancora righe: niente da chiudere."}; return render(); } return go("chiudi"); }
      if(x==="banco") S.banco=null; if(x==="documenti"){ S.docTab="doc"; S.docCat=null; } return go(x);
    case "primoOk": S.firstRun=false; S.stack=[]; return go(S.user?"home":"accesso", false);
    case "camNo": return go("camNo");
    case "who": S.pinFor=x; S.pin=""; return go("pin");
    case "key": if(x==="⌫") S.pin=S.pin.slice(0,-1); else if(S.pin.length<6) S.pin+=x; if(S.pin.length===6) return act("login"); return render();
    case "login": { S.user=USERS.find(u=>u.n===S.pinFor); log(`Accesso`); S.stack=[]; const r=S.resume; S.resume=null; if(r){ S.screen=r; S.stack=["home"]; log("Ripreso il lavoro lasciato a metà"); return render(); } return go("home", false); }
    case "esci": log(`Uscita`); S.user=null; S.stack=[]; return go("accesso", false);
    case "updNow": S.update=false; log("Aggiornamento programmato per stasera, dopo la copia di sicurezza"); return render();
    case "updLater": S.update=false; return render();
    case "syncNow": S.sync=true; log("Aggiorna ora: scambio riuscito, coda vuota"); return render();
    case "ddt": S.lastDdt=+x; return go("ddt");
    /* Nuovo DDT */
    case "ndStart": S.nd={step:0, forn:null, num:"", data:"", ofCit:"", foto:false, letto:null, dup:null}; return go("nuovoDdt");
    case "ndForn": S.nd.forn=[x,y,...rest].filter(Boolean).join(":"); S.nd.step=1; return render();
    case "ndFoto": S.nd.foto = x!=="skip"; S.nd.letto = x==="ok" ? true : x==="no" ? false : null;
      if(x==="ok"){ S.nd.num = S.nd.forn==="Idrotecnica Nord" ? "698/00" : "2310"; S.nd.data="18/11/2026"; S.nd.ofCit = S.nd.forn==="Idrotecnica Nord" ? "OF 1210" : ""; }
      S.nd.step=2; render(); return window.scrollTo(0,0);
    case "ndAnnulla": S.nd=null; return back();
    case "ndApri": { const N=S.nd; N.num=document.getElementById("num").value.trim(); N.data=document.getElementById("dat").value.trim(); N.ofCit=document.getElementById("ofc").value;
      if(!N.num){ S.nd.letto=false; return render(); }
      const dup=S.ddts.find(d=>d.forn===N.forn && d.num===N.num);
      if(dup && N.dup!==dup.id){ N.dup=dup.id; return render(); }
      const id=Date.now(); S.ddts.push({id, num:N.num, forn:N.forn, data:N.data||"18/11/2026", open:true, foto:N.foto, ofCit:N.ofCit||null, who:me(), age:"ora", lines:[]}); S.lastDdt=id;
      log(`Apre il DDT ${N.num} di ${N.forn}${N.foto?", foto della bolla salvata":", senza foto"}${N.letto?"; numero e data letti dalla foto, confermati":""}`, "DDT "+N.num);
      S.nd=null; S.stack=S.stack.filter(s=>s!=="nuovoDdt"); S.screen="ricevi"; return go("ddt"); }
    case "sim": return sim(x);
    case "annulla": { const t=S.toast; S.toast=null;
      if(t.kind==="scan") undoScan(t);
      if(t.kind==="put"){ (t.src==="a"?S.area:S.rimetti).splice(t.i,0,t.e); log(`Annulla: ${t.e.a?A(t.e.a).code:""} torna da mettere a posto (correzione collegata)`); }
      if(t.kind==="take"){ const o=S.ordini[t.k]; o.da=null; S.ordine=null; S.pk=null; log(`Annulla: lascia l'ordine ${t.k}, torna disponibile`, "Ordine "+t.k); return back(); }
      if(t.kind==="ship"){ t.ks.forEach(k=>S.ordini[k].stato="pronto"); S.ritiri.shift(); log(`Annulla: ${t.ks.join(", ")} tornano pronti (correzione collegata)`); }
      return render(); }
    case "line": return sheet("line",{i:+x});
    case "lineA": { const i=ddt().lines.findIndex(l=>l.a===x && l.of===ofk(y)); return sheet("line",{i}); }
    case "sheet": return sheet(x, y!==undefined?{i:isNaN(+y)?y:+y, x:rest[0]}:{});
    case "closeSheet": case "bg": if(c==="bg" && el!==EV.target) return; S.sheet=null; return render();
    case "qm": case "qp": { const q=document.getElementById("q"); q.value=Math.max(0,(+q.value||0)+(c==="qp"?1:-1)); return; }
    case "qtyA": return sheet("qty",{a:x, of:ofk(y)});
    case "qok": { const q=(+document.getElementById("q").value||0)*(+document.getElementById("colli").value||1); S.sheet=null;
      if(q>0){ if(!register(x,q,"confermata dall'operatore",ofk(y)||undefined)) return sheet("fuori",{k:x}); if(S.manoBc){ S.controlli.push({id:"c"+(++S.n), t:"collega", a:x, txt:`Barcode della scatola collegato a ${A(x).code} da ${me()}`}); log(`Barcode collegato a ${A(x).code}, da confermare`); S.manoBc=false; } }
      return render(); }
    case "qpick": S.sheet=null; register("S77",+x,"barcode, quantità scelta tra due"); return render();
    case "pickA": { if(!candidates(ddt(),x).length) return sheet("fuori",{k:x}); return sheet("qty",{a:x}); }
    case "fuoriOk": { S.sheet=null; S.controlli.push({id:"c"+(++S.n), t:"senza", a:x, q:1, txt:`Merce senza ordine: 1 ${A(x).code} dal DDT ${ddt().num}`}); S.toast={txt:`Registrato 1 ${A(x).code} senza ordine: aspetta il responsabile`}; log(`1 ${A(x).code} senza ordine, in attesa di decisione`, "DDT "+ddt().num); return render(); }
    case "collega": S.controlli.push({id:"c"+(++S.n), t:"collega", a:x, txt:`Barcode 8009876 collegato a ${A(x).code} da ${me()}`}); log(`Barcode collegato a ${A(x).code}, da confermare`); return sheet("qty",{a:x, sugg:1});
    case "ferma": { const d=ddt(); const motivo=[y,...rest].join(":"); const c0=candidates(d,x)[0]; let l=d.lines.find(z=>z.a===x); if(!l){ l={a:x, of:c0?c0.of:"OF 1210", cnt:0}; d.lines.push(l); } l.ferma=motivo; S.sheet=null;
      if(/codice/.test(motivo) && /da confermare/.test(motivo)) S.controlli.push({id:"c"+(++S.n), t:"cdiff", a:x, txt:`Codice GT-4410N sulla scatola, GT-4410 a catalogo (DDT ${d.num})`});
      if(/unità/.test(motivo)) S.controlli.push({id:"c"+(++S.n), t:"unit", a:x, txt:`Unità RT mai vista per GT-4410 (DDT ${d.num})`});
      log(`Riga ${A(x).code} ferma: ${motivo}`, "DDT "+d.num); return render(); }
    case "bossCarica": { S.sheet=null; const l=ddt().lines.find(z=>z.a==="G44"); if(l) l.ferma=null; log("Anna, sul telefono di "+me()+": carica su GT-4410; GT-4410N diventa codice del fornitore", "DDT "+ddt().num); register("G44",10,"confermato dal responsabile"); return render(); }
    case "convOk": { S.sheet=null; const l=ddt().lines.find(z=>z.a==="G44"); if(l) l.ferma=null; log("Anna approva: 1 RT = 25 m per "+ddt().forn, "DDT "+ddt().num); register("G44",50,"2 RT convertiti"); return render(); }
    case "corr": { const d=ddt(), l=d.lines[+x]; const q=Math.min(l.cnt, l.lastQ||l.cnt); S.sheet=null; undoScan({a:l.a, of:l.of, q}); return render(); }
    case "dmg": return sheet("dmg",{a:x});
    case "dmgOk": { const q=+document.getElementById("dq").value||1, why=document.getElementById("dn").value; const d=ddt(); S.dmgList.push({a:x,q,ddt:d.num}); S.controlli.push({id:"c"+(++S.n), t:"dmg", a:x, txt:`${q} ${A(x).code} danneggiati dal DDT ${d.num}${why?": "+why:""}`}); S.sheet=null; S.toast={txt:`${q} ${A(x).code} danneggiati, messi da parte per il responsabile`}; log(`${q} ${A(x).code} danneggiati${why?" ("+why+")":""}, al responsabile`, "DDT "+d.num); return render(); }
    case "mano": S.manoBc = S.manoBc || false; return sheet("mano",{tab:x});
    case "manoArt": return sheet("mano",{tab:"art", a:x});
    case "manoOf": return sheet("mano",{tab:"ord", of:ofk(x)});
    case "bollaOk": { const l=ddt().lines[+x]; l.bolla = y==="same" ? undefined : (+document.getElementById("bq").value); S.sheet=null; if(l.bolla!==undefined) log(`In bolla ${l.bolla} ${A(l.a).code} (contati ${l.cnt})`, "DDT "+ddt().num); return render(); }
    case "cercaOk": { const n=document.getElementById("cs2").value; if(n){ S.controlli.push({id:"c"+(++S.n), t:"conta", a:x, txt:`Conteggio di ${me()} in ${A(x).loc}: ${n} ${A(x).code}`}); log(`Conteggio: ${n} ${A(x).code} in ${A(x).loc}, vale subito`); } S.sheet=null; return render(); }
    case "nonArrOk": { const d=ddt(); const q=+document.getElementById("na").value||1; const code = ARTS[y] ? A(y).code : y; d.nonArr=(d.nonArr||[]).filter(z=>!(z.of===ofk(x)&&z.code===code)); d.nonArr.push({of:ofk(x), code, a:ARTS[y]?y:null, q}); log(`In bolla ${q} ${code}, non arrivati`, "DDT "+d.num); S.sheet=null; return render(); }
    case "chiudiOk": closeDdt(); S.toast=null; S.stack=["home"]; S.screen="ricevi"; S.sheet={sk:"mettiOra", n:S.area.length}; render(); return window.scrollTo(0,0);
    case "mettiOra": S.stack=["home"]; S.screen="metti"; S.sheet=null; render(); return window.scrollTo(0,0);
    case "nuovo":
      if(x==="start"){ S.newArt={step:0, shots:0, code:"", desc:"", of:null}; S.sheet=null; return go("nuovo"); }
      if(x==="of"){ const o=S.ofs[ofk(y)], r=o.righe[+rest[0]]; S.newArt={step:1, shots:0, code:r.code, desc:r.desc, of:ofk(y), ri:+rest[0]}; S.sheet=null; if(S.screen!=="nuovo") return go("nuovo"); return render(); }
      if(x==="libero"){ S.newArt.step=1; S.newArt.code="VT-1299"; return render(); }
      return;
    case "shot": S.newArt.shots=Math.min(3,S.newArt.shots+1); S.newArt.blur=false; if(S.newArt.shots>=3){ S.newArt.step=2; } return render();
    case "shotBlur": S.newArt.blur=true; return render();
    case "shotsDone": S.newArt.step=2; return render();
    case "word": { const d=document.getElementById("nd"); d.value=(d.value+" "+x).trim(); S.newArt.desc=d.value; return; }
    case "datiOk": S.newArt.code=document.getElementById("nc").value; S.newArt.desc=document.getElementById("nd").value; S.newArt.step=3; return render();
    case "simile": log(`Foto e codice ${S.newArt.code} collegati a ${A(x).code}, da confermare`); S.controlli.push({id:"c"+(++S.n), t:"collega", a:x, txt:`Codice ${S.newArt.code} collegato a ${A(x).code} da ${me()}`}); S.newArt=null; return back();
    case "salvaNuovo": { const N=S.newArt; const k="NEW"+(++S.n); ARTS[k]={code:N.code||"senza codice", desc:N.desc||"articolo nuovo", unit:"pz", loc:"—", price:"da completare", cost:"da completare", photo:"articolo nuovo"};
      S.controlli.push({id:"c"+(++S.n), t:"nuovo", a:k, txt:`Articolo da confermare: ${ARTS[k].code} · ${ARTS[k].desc}, creato da ${me()}`});
      log(`Articolo nuovo ${ARTS[k].code} creato, da confermare`, "DDT "+ddt().num); S.screen=S.stack.pop()||"ddt";
      if(N.of){ S.ofs[N.of].righe[N.ri].a=k; S.newArt=null; S.sheet={sk:"qty", a:k, of:N.of, sugg:1, note:"Articolo nuovo, «da confermare»: si riceve subito."}; return render(); }
      S.newArt=null; S.sheet={sk:"fuori", k}; return render(); }
    case "put": S.put={src:x, i:+y}; return go("put");
    case "putLoc": { const P=S.put, arr=P.src==="a"?S.area:S.rimetti, e=arr[P.i]; const q=+document.getElementById("pq").value||e.q; const copy={...e}; e.q-=q; let removed=false; if(e.q<=0){ arr.splice(P.i,1); removed=true; }
      log(`Messo a posto: ${q} ${A(e.a).code} in ${x}${x!==A(e.a).loc?" (non è l'abituale)":""}${P.src==="r"?" · i pezzi tornano liberi":""}`);
      S.sheet=null; S.screen=S.stack.pop()||"metti"; S.toast = removed ? {kind:"put", txt:`Messi ${q} ${A(e.a).code} in ${x}`, src:P.src, i:P.i, e:copy} : {txt:`Messi ${q} ${A(e.a).code} in ${x}; ne restano ${e.q}`}; render(); return window.scrollTo(0,0); }
    /* Vendita assistita */
    case "vendNew": { const id="v"+(++S.n); S.vendite.unshift({id, cli:null, who:me(), age:"ora", righe:[]}); S.banco=id; log("Inizia una vendita assistita"); return go("vendita"); }
    case "vend": S.banco=x; return go("vendita");
    case "cli": S.vendite.find(v=>v.id===S.banco).cli=[x,y].filter(Boolean).join(":"); return render();
    case "bancoAdd": { const B=S.vendite.find(v=>v.id===S.banco); if(x==="S77") return sheet("bancoTogli"); const r=B.righe.find(z=>z.a===x); r? r.q++ : B.righe.push({a:x,q:1}); log(`Vendita assistita: 1 ${A(x).code} da ${A(x).loc}`); return render(); }
    case "bancoTogli": { S.sheet=null; S.vendite.find(v=>v.id===S.banco).righe.push({a:"S77",q:2,tolto:true}); log("Vendita assistita: 2 SL-77, da togliere all'ordine 1039 alla conferma"); return render(); }
    case "bancoOk": { const B=S.vendite.find(v=>v.id===S.banco); const r=B.righe.find(z=>z.a==="R110"&&z.q>=4); if(r && !B.ricontrollato){ B.ricontrollato=true; return sheet("ricontrollo"); } return act("bancoOk2:0"); }
    case "bancoOk2": { const B=S.vendite.find(v=>v.id===S.banco); if(+x){ const r=B.righe.find(z=>z.a==="R110"); if(r) r.q=+x; }
      if(B.righe.some(z=>z.tolto)) S.controlli.push({id:"c"+(++S.n), t:"conta", a:"S77", txt:"Vendita assistita: 2 SL-77 tolti all'ordine 1039 da "+me()});
      const vid="V-0"+(413+S.n); S.venduteOk.unshift({id:vid, cli:B.cli, who:me(), at:"18/11 "+clock(), righe:B.righe}); S.coda_out.unshift({txt:"Vendita assistita "+vid, stato:"inviato"});
      log(`Vendita assistita ${vid} confermata per ${B.cli}: l'ordine va al gestionale, dove si fanno le ricevute`, "Vendita "+vid);
      S.vendite=S.vendite.filter(v=>v.id!==B.id); S.banco=null; S.sheet=null; S.stack=["home"]; S.screen="banco"; S.toast=null; return render(); }
    case "vendAnnOk": { const B=S.vendite.find(v=>v.id===S.banco); S.vendite=S.vendite.filter(v=>v.id!==B.id); log(`Vendita assistita annullata (${B.cli||"senza cliente"}, ${B.righe.length} articoli)`); S.banco=null; S.sheet=null; S.screen="banco"; S.stack=["home"]; return render(); }
    /* Cerca */
    case "scheda": S.cerca=x; return go("scheda");
    case "conta": if(!x) return; S.cnt=x==="RIC"?"area di ricevimento":x; return go("conta");
    case "contaOk": { const n=document.getElementById("cn").value; S.controlli.push({id:"c"+(++S.n), t:"conta", a:S.cerca, txt:`Conteggio di ${me()} in ${S.cnt}: ${n} ${A(S.cerca).code}`}); log(`Conteggio: ${n} ${A(S.cerca).code} in ${S.cnt}, vale subito`); return back(); }
    case "dmgCardOk": { const q=+document.getElementById("dq2").value||1, where=document.getElementById("dl").value; S.controlli.push({id:"c"+(++S.n), t:"dmg", a:S.cerca, txt:`${q} ${A(S.cerca).code} danneggiati in ${where}, segnati da ${me()}`}); log(`${q} ${A(S.cerca).code} danneggiati in ${where}: escono dalla merce assegnabile, al responsabile`); S.sheet=null; return render(); }
    case "aggFoto": S.newArt={step:1, shots:0, code:A(S.cerca).code, desc:A(S.cerca).desc, agg:true}; log("Aggiungi foto: stessa guida dell'inserimento"); return go("nuovo");
    /* Documenti */
    case "docTab": S.docTab=x; return render();
    case "docCat": S.docCat=x||null; S.docTab="doc"; return render();
    case "doc": S.docSel=[x,y,...rest].filter(Boolean).join(":").replace(/_/g," "); return go("doc");
    case "regWho": S.regWho=x; return render();
    /* Responsabile */
    case "ctl": return sheet("ctl",{id:x});
    case "ctlDone": { const c=S.controlli.find(z=>z.id===x); S.controlli=S.controlli.filter(z=>z.id!==x); log(`«${[y,...rest].join(":")}» per ${c.txt}`); S.sheet=null; return render(); }
    /* Prelievo */
    case "piano": S.pianoSel=x; return go("piano");
    case "ord": { const o=S.ordini[x]; const nuovo=o.da!==me(); o.da=me(); o.age=o.age||"poco"; S.ordine=x; S.pk=S.pk&&S.pkOrd===x?S.pk:{n:0,st:0}; S.pkOrd=x; if(nuovo) log(`Prende l'ordine ${x}: gli altri lo vedono in preparazione`, "Ordine "+x); go("pick"); if(nuovo){ S.toast={kind:"take", txt:`Hai preso l'ordine ${x}`, k:x}; render(); } return; }
    case "prossimo": { const k=Object.keys(S.ordini).find(k=>S.ordini[k].shop&&S.ordini[k].stato==="aperto"&&!S.ordini[k].da); if(!k) return; return act("ord:"+k); }
    case "pkLoc": S.toast=null; if(x==="no"){ S.pk.warn="Non è l'ubicazione proposta. Prendi da qui solo se l'articolo c'è: il programma la cambia."; } else { S.pk.warn=null; S.pk.st=1; } return render();
    case "pkArt": S.toast=null; if(x==="no"){ S.pk.warn="Stop: non è l'articolo di questa riga. Rimettilo a posto e inquadra quello giusto."; } else { S.pk.warn=null; S.pk.st=2; } return render();
    case "pkQty": { const o=S.ordini[S.ordine], r=pickRows(o)[S.pk.n]; const q=+document.getElementById("q").value;
      if(q>r.ass){ S.controlli.push({id:"c"+(++S.n), t:"prel", a:r.a, txt:`Prelievo oltre il richiesto: ${q} ${A(r.a).code} su ${r.ass} per l'ordine ${S.ordine}, da ${me()}`}); log(`Prelievo oltre il richiesto: ${q} ${A(r.a).code} su ${r.ass}, al responsabile`, "Ordine "+S.ordine); }
      log(`Prelevati ${q} ${A(r.a).code} da ${r.vend||A(r.a).loc} per l'ordine ${S.ordine}`, "Ordine "+S.ordine); S.pk={n:S.pk.n+1,st:0}; S.toast={txt: q>r.ass ? `♪ Presi ${q} ${A(r.a).code} su ${r.ass}: il di più lo vede il responsabile` : `♪ Presi ${q} ${A(r.a).code}`}; render(); return window.scrollTo(0,0); }
    case "pronto": { const o=S.ordini[S.ordine]; o.stato="pronto"; o.pronto="ora"; o.colli=document.getElementById("colli2").value; o.kg=document.getElementById("kg").value; o.prep=document.getElementById("prep").value;
      log(`Ordine ${S.ordine} pronto (evaso): ${o.colli} colli, ${o.kg} kg, preparato da ${o.prep}${o.prep!==me()?` (registrato da ${me()})`:""}; ${o.shop?"a Shopify non si manda niente finché non parte":"documento di prelievo al gestionale"}`, "Ordine "+S.ordine); S.ordine=null; S.pk=null; back(); return; }
    case "pkBack": S.pk.n=Math.max(0,pickRows(S.ordini[S.ordine]).length-1); S.pk.st=2; return render();
    case "resta": S.resta=S.resta||{}; S.resta[x]=!S.resta[x]; return render();
    case "ritirato": { const ks=Object.keys(S.ordini).filter(k=>S.ordini[k].stato==="pronto"&&S.ordini[k].cour===x&&!(S.resta||{})[k]); ks.forEach(k=>S.ordini[k].stato="spedito"); const id=`Ritiro ${x} 18/11 ${clock()}`; S.ritiri.unshift({id, cour:x, day:"18/11", ord:ks, who:me()});
      log(`Ritirato da ${S.cour[x]}: spediti ${ks.join(", ")}; spedizione al gestionale${S.coda?" e a Shopify":""}`, id); S.sheet=null; S.toast={kind:"ship", txt:`Spediti ${ks.length} ordini con ${S.cour[x]}`, ks}; return render(); }
    case "creaPiano": { const ks=[...document.querySelectorAll("[data-ord]")].filter(i=>i.checked).map(i=>i.dataset.ord); if(!ks.length) return; const t=document.getElementById("pt").value, pp=document.getElementById("pp").value; S.piani.push({id:"p"+(++S.n), t, prep:pp, ord:ks}); log(`Crea il piano «${t}» per ${pp}: ${ks.join(", ")}`); return back(); }
    case "sc":
      if(x==="rete"){ S.online=!S.online; log(S.online?`Rete tornata: partite ${S.pendingOffline} letture`:"Rete assente"); if(S.online) S.pendingOffline=0; return back(); }
      if(x==="timeout"){ if(!S.user) return back(); S.resume=S.stack[S.stack.length-1]||"home"; log(`Uscita automatica dopo 30 minuti senza uso: il lavoro a metà resta`); S.user=null; S.stack=[]; return go("accesso", false); }
      if(x==="sync"){ S.sync=!S.sync; return back(); }
      if(x==="coda"){ S.coda=!S.coda; log(S.coda?"Ora il magazzino lavora con la coda":"Ora il magazzino lavora con i piani"); S.stack=[]; return go(S.user?"home":"accesso", false); }
      if(x==="vuoti"){ S.ddts.forEach(d=>d.open=false); S.area=[]; S.rimetti=[]; S.vendite=[]; S.controlli=[]; Object.values(S.ordini).forEach(o=>{ if(o.stato!=="spedito"){ o.stato="spedito"; o.da=null; } }); log("Scenario: elenchi svuotati"); S.stack=[]; return go(S.user?"home":"accesso", false); }
      if(x==="primo"){ S.stack=[]; return go("primo", false); }
      if(x==="boss"){ S.pinFor="Anna"; S.stack=[]; return go("pin", false); }
      if(x==="reset"){ S=initial(); return render(); }
  }
}

function sim(k){ S.sheet=null;
  if(!S.online){ S.pendingOffline++; return sheet("offline"); }
  const d=ddt();
  if(d.forn!=="Idrotecnica Nord" && !["fuori","nls","bc2","asp"].includes(k)){ S.toast={txt:"Questo esempio vale per i DDT di Idrotecnica Nord: apri il 698/00 o creane uno nuovo."}; return render(); }
  switch(k){
    case "bc": register("R110",1,"barcode"); return render();
    case "bcq": register("R110",6,"barcode, 6 letto sulla scatola"); return render();
    case "bc2": return sheet("bc2");
    case "bcx": return sheet("bcx");
    case "cs": return sheet("questo",{a:"S77"});
    case "csim": return sheet("questo",{a:"S77", warn:"Codice simile, controlla: sulla scatola «SL-7», a catalogo «SL-77»."});
    case "cdiff": return sheet("cdiff");
    case "asp": return sheet("aspetto");
    case "multi": return sheet("multi");
    case "q2": return sheet("q2");
    case "vend": register("V12",4,"barcode, 4 letto sulla scatola"); return render();
    case "fuori": return sheet("fuori",{k: d.forn==="Idrotecnica Nord" ? "N55" : "V12"});
    case "unit": return sheet("unit");
    case "nls": S.manoBc=true; return sheet("nls");
  }
}

let EV = null;
document.addEventListener("click", e => { const b=e.target.closest("[data-act]"); if(!b || b.disabled) return; EV = e; act(b.dataset.act, b); });
render();
</script>
