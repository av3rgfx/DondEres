.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pin i.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:22px;font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}

.scen{display:grid;gap:6px}

.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-height:42px;font-weight:600}

.grp-h{font-size:13px;margin:4px 0 -4px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px}
.sub{border-left:3px solid var(--line);padding-left:10px;display:grid;gap:6px}
.new{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--boss-soft);color:var(--boss);margin-left:4px;vertical-align:1px}

details.tip{font-size:14px;color:var(--muted)} details.tip summary{cursor:pointer;width:fit-content;min-height:32px;display:flex;align-items:center;font-weight:600}
</style>

const ddt = () => S.ddts.find(d => d.id===S.lastDdt);
const dsort = s => s.split("/").reverse().join("");

/* ===== Abbinamento automatico delle letture agli ordini fornitore (70, 183, 184) ===== */
function candidates(d, a){
  const out=[];
  for(const [k,o] of Object.entries(S.ofs)){ if(o.forn!==d.forn) continue;
    o.righe.forEach((r,ri)=>{ if(r.a===a && r.ric<r.q) out.push({of:k, ri, o, r, res:r.q-r.ric}); }); }
  return out.sort((x,y)=> ((y.of===d.ofCit)-(x.of===d.ofCit)) || ((!!y.o.cli)-(!!x.o.cli)) || dsort(x.o.data).localeCompare(dsort(y.o.data)));
}
function ofLine(l){ const o=S.ofs[l.of]; return o ? o.righe.find(r=>r.a===l.a) : null; }
function register(a, q, how, ofKey){
  const d=ddt(); const c = candidates(d,a); let pick = ofKey ? c.find(x=>x.of===ofKey) : c[0];
  if(!pick && ofKey){ const o=S.ofs[ofKey]; const r=o&&o.righe.find(r=>r.a===a); if(r) pick={of:ofKey, r, o}; }
  if(!pick) return false;
  let l = d.lines.find(x=>x.a===a && x.of===pick.of); if(!l){ l={a, of:pick.of, cnt:0}; d.lines.push(l); }
  l.cnt+=q; l.lastQ=q; pick.r.ric+=q; if(!d.who) d.who=me();
  const e=S.area.find(x=>x.a===a && x.from==="DDT "+d.num); e? e.q+=q : S.area.push({a,q,from:"DDT "+d.num, forn:d.forn});
  S.toast = {kind:"scan", txt:`♪ Registrati ${q} ${A(a).unit} · ${A(a).code} su ${pick.of}${pick.o.cli?" (per "+pick.o.cli+")":""}`, a, of:pick.of, q};
  log(`+${q} ${A(a).code} (${how}) su ${pick.of}`, "DDT "+d.num);
  if(pick.r.ric>pick.r.q) S.controlli.push({id:"c"+(++S.n), t:"ecc", a, txt:`Eccedenza: ${pick.r.ric} ${A(a).code} su ${pick.r.q} ordinati (${pick.of}, DDT ${d.num})`});
  if(!S.online) S.pendingOffline++;
  return true;
}
function undoScan(t){ const d=ddt(); const l=d.lines.find(x=>x.a===t.a && x.of===t.of); if(!l) return; l.cnt-=t.q; const r=ofLine(l); if(r) r.ric-=t.q;
  const e=S.area.find(z=>z.a===t.a && z.from==="DDT "+d.num); if(e){ e.q-=t.q; if(e.q<=0) S.area.splice(S.area.indexOf(e),1); }
  if(l.cnt<=0 && !l.ferma) d.lines.splice(d.lines.indexOf(l),1);
  log(`Annulla: −${t.q} ${A(t.a).code} (correzione collegata alla scansione, niente si cancella)`, "DDT "+d.num); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hdr = (title, sub, opts={}) => `<header class="top">${opts.noBack?"":`<button class="ic" data-act="back" aria-label="Indietro">‹</button>`}<h1>${title}${sub?`<small>${sub}</small>`:""}</h1>${opts.right||""}</header>`;
const row = (l, r, cls="", act="", small="") => act ? `<button class="row ${cls}" data-act="${act}"><span class="l"><span>${l}</span>${small?`<small>${small}</small>`:""}</span><span class="r">${r}</span></button>` : `<div class="row ${cls}"><span class="l"><span>${l}</span>${small?`<small>${small}</small>`:""}</span><span class="r">${r}</span></div>`;

/* Cose in sospeso (187): quattro gruppi, dal più vecchio. Ogni voce: {l, r, cls, act, small, who, age, ferma, old} */
function sospesi(items, empty){
  const g = {fermi:[], vecchi:[], miei:[], altri:[]};
  items.forEach(x => (x.ferma ? g.fermi : x.old ? g.vecchi : x.who===me() ? g.miei : g.altri).push(x));
  const blk = (t, arr) => arr.length ? `<div class="grp-h"><span>${t}</span><span>${arr.length}</span></div><div class="list">${arr.map(x=>row(x.l, x.r, x.cls||"", x.act||"", x.small||"")).join("")}</div>` : "";
  const out = blk("I miei, in corso", g.miei) + blk("Di colleghi", g.altri) + blk("Fermi", g.fermi) + blk("Vecchi, oltre 2 giorni", g.vecchi);
  return `<h2>In sospeso</h2>` + (out || `<p class="muted">${empty}</p>`);
}

/* Numeri della prima schermata: ciò che tocca a chi ha fatto l'accesso (187) */
const counts = () => ({

  spedisci: Object.values(S.ordini).filter(o=>o.stato==="pronto").length,
  banco: S.vendite.filter(v=>v.who===me()).length,
  controlli: myCtl().length
});
V.home = () => {
  const c = counts();
  const t = (n, lab, act, cls="") => `<button class="tile ${n===0?"zero":""} ${cls}" data-act="${act}"><b>${n===null?"·":n}</b><span>${lab}</span></button>`;
  return `${hdr(`Ciao ${S.user.n}`, ((S.user.perm||[]).length?(S.user.perm).map(g=>PERM[g]).join(" e ")+" · ":"")+S.user.m.map(x=>MANS[x]).join(" e "),{noBack:1,right:`<button class="ic" data-act="esci">Esci</button>`})}
  ${isAdmin() && S.update ? `<div class="banner boss"><span>È disponibile un aggiornamento. Prima si fa una copia di sicurezza.</span><div class="btns two"><button class="btn small boss" data-act="updNow">Installa stasera</button><button class="btn small" data-act="updLater">Più tardi</button></div></div>`:""}
  ${isAdmin() && !S.sync ? `<div class="banner warn">Scambio con il gestionale non riuscito da 15 minuti. Si lavora con gli ultimi dati; 3 documenti aspettano in coda. <button class="btn small" data-act="syncNow">Aggiorna ora</button></div>`:""}
  <main class="main">
  ${isBoss()||canPlan()?t(c.controlli,"Da controllare","go:controlli","boss"):""}
  ${(()=>{ const L={ricevi:[c.ricevi,"Ricevi DDT"],metti:[c.metti,"Metti a posto"],preleva:[c.preleva,"Preleva"],spedisci:[c.spedisci,"Spedisci"],banco:[c.banco,"Vendita assistita"],resi:[resiCount(),"Resi"],inv:[invCount(),"Inventario"],cerca:[null,"Cerca e conta"]};
    const all=["ricevi","metti","resi","inv","preleva","spedisci","banco","cerca"].filter(k=>k!=="spedisci"||canShip());
    const mine=isAdmin()||isBoss()?all:[...new Set(S.user.m.flatMap(m=>MLAV[m]))].filter(k=>all.includes(k));
    const rest=all.filter(k=>!mine.includes(k) && (isAdmin() || isBoss() || (k==="spedisci" ? canShip() : (S.user.extra||[]).includes(k))));
    return `<div class="tiles">${mine.map(k=>t(L[k][0],L[k][1],"go:"+k)).join("")}</div>`+(rest.length?`<h2>Altri lavori</h2><div class="list">${rest.map(k=>row(L[k][1],L[k][0]===null?"›":L[k][0],"","go:"+k)).join("")}</div>`:""); })()}
  <div class="list">${row(`Documenti<span class="new">nuovo</span>`,"›","","go:documenti","storico di tutto, per categoria; registro delle operazioni")}</div>

  <p class="muted">Il numero dice cosa tocca a te. ${S.coda?"Magazzino con la coda (come Shopify).":"Magazzino con i piani di spedizione (come UFP)."} Da «Scenari» si cambia magazzino e si vede cosa è cambiato in questa versione.</p>
  </main>`;
};

    small: ferma ? `1 riga ferma: ${esc(ferma.ferma)}` : d.who===me() ? `aperto ${d.age||"ora"}` : `${d.who}, ${d.age||"ora"}`, who:d.who, ferma:!!ferma, old:d.old}; });

/* Nuovo DDT (184): fornitore → foto della bolla → numero e data letti, da confermare */
V.nuovoDdt = () => { const N=S.nd;
  const steps = `<div class="steps">${[0,1,2].map(s=>`<i class="${s<=N.step?"on":""}"></i>`).join("")}</div>`;
  if(N.step===0){ const fs=Object.keys(FORN).map(f=>[f, Object.values(S.ofs).filter(o=>o.forn===f && o.righe.some(r=>r.ric<r.q)).length]).sort((x,y)=>y[1]-x[1]);
    return `${hdr("Nuovo DDT","1 · Fornitore")}<main class="main">${steps}
    <div class="field"><label for="fq">Cerca il fornitore</label><input id="fq" type="text" placeholder="nome o codice"></div>
    <div class="list">${fs.map(([f,n])=>row(esc(f), n?`${n} ordini aperti`:"nessun ordine aperto", n?"":"dim", "ndForn:"+f)).join("")}</div>
    <p class="muted">Prima i fornitori con ordini aperti.</p></main>`; }
  if(N.step===1) return `${hdr("Nuovo DDT","2 · Foto della bolla")}<main class="main">${steps}
    <div class="cam"><div class="frame big">Inquadra la bolla intera<br>appoggiata su un piano</div>
    <div class="chips"><button class="chip" data-act="ndFoto:ok">Simula: bolla leggibile</button><button class="chip" data-act="ndFoto:no">Simula: bolla stropicciata, non si legge</button></div></div>
    <button class="btn" data-act="ndFoto:skip">La bolla non c'è: continua senza foto</button>
    <p class="muted">La foto resta con il DDT nei Documenti. Numero e data li propone il programma: tu li confermi.</p></main>`;
  const ofs=Object.entries(S.ofs).filter(([k,o])=>o.forn===N.forn);
  return `${hdr("Nuovo DDT","3 · Controlla e apri")}<main class="main">${steps}
    ${N.foto?photo("bolla di "+N.forn):`<div class="warnbox">Senza foto della bolla: il responsabile lo vede nei Documenti.</div>`}
    ${N.letto===false?`<div class="warnbox">Non riesco a leggere numero e data: scrivili tu, com'è stampato.</div>`:N.letto?`<div class="warnbox boss">Letti dalla foto: controlla che siano giusti.</div>`:""}
    <div class="field"><label for="num">Numero del DDT, com'è scritto</label><input id="num" type="text" value="${esc(N.num)}" placeholder="per esempio 698/01"></div>
    <div class="field"><label for="dat">Data del DDT</label><input id="dat" type="text" inputmode="numeric" value="${esc(N.data)}" placeholder="gg/mm/aaaa"></div>
    <div class="field"><label for="ofc">Ordine citato sulla bolla (facoltativo)</label><select id="ofc"><option value="">nessuno o non lo so</option>${ofs.map(([k])=>`<option ${k===N.ofCit?"selected":""}>${k}</option>`).join("")}</select></div>
    ${N.dup?`<div class="warnbox">Possibile doppione: c'è già il DDT ${esc(N.num)} di ${esc(N.forn)}. Apri quello, oppure tocca di nuovo «Apri il DDT» per crearlo lo stesso.</div><button class="btn" data-act="ddt:${N.dup}">Apri quello già aperto</button>`:""}
    ${N.rov?`<div class="warnbox bad">Collo rovinato all'arrivo</div>${photo("foto del collo")}<div class="tabs" role="group" aria-label="Riserva"><button data-act="ndRis:si" aria-pressed="${N.ris==="si"}">Firmato con riserva</button><button data-act="ndRis:no" aria-pressed="${N.ris==="no"}">Senza riserva</button></div>`:`<button class="btn" data-act="ndRov">Collo rovinato all'arrivo? Fotografalo</button>`}
    <div class="btns two"><button class="btn" data-act="ndAnnulla">Annulla</button><button class="btn go" data-act="ndApri">Apri il DDT</button></div>
    <p class="muted">Prova a lasciare 698/00: c'è già. Se scegli l'ordine citato, le letture vanno prima su quello.</p></main>`; };

const SIMS = [
  ["bc","Barcode noto"],["bcq","Barcode, quantità sulla scatola"],["bc2","Barcode su 2 articoli"],["bcx","Barcode sconosciuto"],
  ["cs","Codice stampato"],["csim","Codice simile"],["cdiff","Codice diverso (158)"],["asp","Solo aspetto"],
  ["multi","Due codici diversi"],["q2","Due quantità"],["vend","Valvola rossa (è su 3 ordini)"],["fuori","Non è tra gli attesi"],["unit","Unità mai vista"],["nls","Non lo so"]
];
V.ddt = () => {
  const d = ddt();
  const lines = d.lines.map((l,i)=>{ const r=ofLine(l), o=S.ofs[l.of];
    const cls = l.ferma ? "halt" : r && r.ric>=r.q ? "done" : "part";
    const small = l.ferma ? `Ferma: ${esc(l.ferma)}` : `${l.of}${o&&o.cli?" · per "+esc(o.cli):""}${r?` · ordinati ${r.q}`:""}`;
    return row(`${A(l.a).code} · ${esc(A(l.a).desc)}`, `${l.cnt}`, cls, "line:"+i, small); }).join("");
  const att = Object.entries(S.ofs).filter(([k,o])=>o.forn===d.forn).flatMap(([k,o])=>o.righe.map((r,ri)=>({k,o,r,ri}))).filter(x=>x.r.ric<x.r.q);
  const dm = S.dmgList.filter(x=>x.ddt===d.num);
  return `${hdr(`DDT ${esc(d.num)}`, esc(d.forn)+(d.ofCit?` · bolla cita ${d.ofCit}`:""),{right:`<button class="ic" data-act="go:chiudi">Chiudi DDT</button>`})}
  <main class="main">
    <div class="cam"><div class="frame">Inquadratura sempre accesa<br>inquadra la scatola</div>
      <div class="chips"><button class="chip" data-act="sheet:simList">Simula cosa inquadri ▾</button></div></div>
    ${toastHtml()}
    <div class="btns two"><button class="btn" data-act="mano:bolla">Aggiungi a mano</button><button class="btn" data-act="sheet:cerca">Cerca</button></div>
    <h2>Righe lette</h2><div class="list">${lines || `<p class="muted">Ancora niente. Inquadra la prima scatola: la riga nasce dalla lettura e si abbina da sola all'ordine giusto.</p>`}</div>
    ${dm.length?`<h2>Danneggiati, da parte</h2><div class="list">${dm.map(x=>row(`${A(x.a).code} · ${esc(A(x.a).desc)}`,`${x.q}`,"halt","","aspetta il responsabile")).join("")}</div>`:""}
    <details class="exp"><summary>Attesi dal fornitore: ${att.length} righe in ${new Set(att.map(x=>x.k)).size} ordini</summary><div class="list">
      ${att.map(x=>x.r.a ? row(`${A(x.r.a).code} · ${esc(A(x.r.a).desc)}`, `mancano ${x.r.q-x.r.ric}`, "", "", `${x.k} del ${x.o.data.slice(0,5)}${x.o.cli?" · per "+esc(x.o.cli):""}`)
        : row(`${esc(x.r.code)} · ${esc(x.r.desc)}`, `mancano ${x.r.q-x.r.ric}`, "part", `nuovo:of:${x.k.replace(" ","_")}:${x.ri}`, `${x.k} · senza articolo a catalogo: tocca per crearlo`)).join("")}
    </div><p class="muted">Solo da guardare: le quantità non si riempiono da qui (186).</p></details>
  </main>`;
};

SH.mano = ({tab, a, of}) => { const d=ddt();
  const tabs = `<div class="tabs" role="group" aria-label="Come cerchi"><button data-act="mano:bolla" aria-pressed="${tab==="bolla"}">Dalla bolla</button><button data-act="mano:art" aria-pressed="${tab==="art"}">Per articolo</button><button data-act="mano:ord" aria-pressed="${tab==="ord"}">Per ordine</button></div>`;
  if(tab==="bolla"){ const rows = Object.entries(S.ofs).filter(([k,o])=>o.forn===d.forn).sort(([k1],[k2])=>(k2===d.ofCit)-(k1===d.ofCit)).flatMap(([k,o])=>o.righe.filter(r=>r.a && r.ric<r.q).map(r=>({k,r})));
    return `<h3>Aggiungi a mano · dalla bolla</h3>${tabs}<p class="muted">Le righe della bolla non ancora trovate, nell'ordine del foglio${d.ofCit?"":" (senza lettura della bolla: dall'ordine citato)"}. Tocca la riga e scrivi quanti ne hai contati (224).</p>
    <div class="list">${rows.map(({k,r})=>row(`${A(r.a).code} · ${esc(A(r.a).desc)}`,`in bolla ${r.q-r.ric}`,"",`qtyA:${r.a}:${k.replace(" ","_")}`,`${k}`)).join("")}
    ${row("GT-4410 · Guaina corrugata 20 mm","in bolla 30","part","sheet:noOrd","nessun ordine aperto trovato")}</div>
    <p class="muted">Il numero contato si scrive sempre: nessun tasto riempie la quantità della bolla (186).</p>`; }
  if(tab==="art" && !a){ const arts=Object.keys(ARTS).filter(k=>candidates(d,k).length);
    return `<h3>Aggiungi a mano</h3>${tabs}<div class="field"><label for="ma">Codice o parte della descrizione</label><input id="ma" type="text" placeholder="per esempio valvola"></div>
    <div class="list">${arts.map(k=>pick(k,"manoArt:"+k,`<small>${candidates(d,k).length} ordini aperti</small>`)).join("")}</div>
    <p class="muted">Qui ci sono solo gli articoli che ${esc(d.forn)} deve ancora mandare. Per gli altri: «Articolo nuovo» o merce non prevista.</p>`; }
  if(tab==="art"){ const c=candidates(d,a);
    return `<h3>${A(a).code} · in quale ordine?</h3>${tabs}<p class="muted">${esc(A(a).desc)} è in ${c.length} ordini aperti, nell'ordine in cui li sceglierei io.</p>
    <div class="list">${c.map((x,j)=>row(`${x.of} del ${x.o.data.slice(0,5)}${x.o.cli?" · per "+esc(x.o.cli):""}`,`mancano ${x.res}`, j===0?"boss":"", `qtyA:${a}:${x.of.replace(" ","_")}`, j===0?"proposto":"")).join("")}</div>
    <button class="btn go" data-act="qtyA:${a}:${c[0].of.replace(" ","_")}">Questo: ${c[0].of}</button>

/* ===== Chiudi DDT: riepilogo con le conseguenze (190) ===== */
V.chiudi = () => { const d=ddt(); const ferme=d.lines.filter(l=>l.ferma), pronte=d.lines.filter(l=>!l.ferma);
  const mancanti = Object.entries(S.ofs).filter(([k,o])=>o.forn===d.forn).flatMap(([k,o])=>o.righe.filter(r=>r.ric<r.q).map(r=>({k,r})));
  const diffB = pronte.filter(l=>l.bolla!==undefined && l.bolla!==l.cnt);
  const dm = S.dmgList.filter(x=>x.ddt===d.num);
  return `${hdr(`Chiudi DDT ${esc(d.num)}?`, esc(d.forn))}<main class="main">
  ${d.foto?photo("bolla del DDT "+d.num):`<div class="warnbox">Questo DDT non ha la foto della bolla.</div>`}
  <p class="muted">Guarda la bolla: tocca una riga solo se la bolla dice un'altra quantità (192). Anche un articolo atteso e non arrivato, se la bolla lo porta.</p>
  <h2>Righe pronte · contati e in bolla</h2><div class="list">${pronte.map(l=>{ const i=d.lines.indexOf(l), r=ofLine(l);
    const diff = l.bolla!==undefined && l.bolla!==l.cnt;
    return row(`${A(l.a).code} · ${l.of}`, `${l.cnt}`, diff?"part":"done", "sheet:bolla:"+i, `ordinati ${r?r.q:"?"} · in bolla ${l.bolla===undefined?"come contati":l.bolla}${diff?" · differenza al responsabile":""}`); }).join("") || `<p class="muted">Nessuna riga pronta.</p>`}</div>
  ${ferme.length?`<h2>Righe ferme</h2><div class="list">${ferme.map(l=>row(`${A(l.a).code}`, `${l.cnt}`, "halt", "", esc(l.ferma))).join("")}</div>`:""}
  ${dm.length?`<h2>Danneggiati</h2><div class="list">${dm.map(x=>row(A(x.a).code,`${x.q}`,"halt","","al responsabile")).join("")}</div>`:""}
  ${(d.nonArr||[]).length?`<h2>In bolla ma non arrivati</h2><div class="list">${d.nonArr.map(x=>row(esc(x.code),`0 di ${x.q}`,"halt","",`${x.of} · in bolla ${x.q}, contati 0: al responsabile`)).join("")}</div>`:""}
  <details class="exp"><summary>Ancora attesi da ${esc(d.forn)}: ${mancanti.length} righe</summary><div class="list">${mancanti.map(x=>row(x.r.a?A(x.r.a).code:esc(x.r.code), `mancano ${x.r.q-x.r.ric}`, "", `sheet:nonArr:${x.k.replace(" ","_")}:${x.r.a||x.r.code}`, `${x.k} · tocca se la bolla lo porta`)).join("")}</div><p class="muted">Restano aperte negli ordini: le chiude solo il responsabile (33).</p></details>
  <div class="card"><b>Cosa succede se chiudi</b><ul class="muted" style="margin:0;padding-left:20px;display:grid;gap:4px">
    <li>Al gestionale va un carico con ${pronte.length} righe.</li>
    ${ferme.length?`<li>${ferme.length} riga ferma avrà poi un carico suo, quando decide il responsabile (82).</li>`:""}
    ${diffB.length+(d.nonArr||[]).length?`<li>${diffB.length+(d.nonArr||[]).length} differenze con la bolla vanno al responsabile.</li>`:""}
    <li>Il DDT non si riapre: dopo, corregge solo il responsabile (81).</li></ul></div>
  <div class="btns two"><button class="btn" data-act="back">Torna al DDT</button><button class="btn go" data-act="chiudiOk" ${pronte.length?"":"disabled"}>${ferme.length?"Chiudi con le righe pronte":"Chiudi DDT"}</button></div>
  </main>`; };
function closeDdt(){ const d=ddt(); d.open=false; d.chiuso="18/11 "+clock();
  d.lines.filter(l=>!l.ferma && l.bolla!==undefined && l.bolla!==l.cnt).forEach(l=>S.controlli.push({id:"c"+(++S.n), t:"bolla", a:l.a, ddt:"DDT "+d.num, riga:`${A(l.a).code} · ${l.bolla} · ${l.cnt} · ${l.cnt-l.bolla>0?"+":""}${l.cnt-l.bolla}`, txt:`Differenza con la bolla: ${A(l.a).code} contati ${l.cnt}, in bolla ${l.bolla} (DDT ${d.num})`}));
  (d.nonArr||[]).forEach(x=>S.controlli.push({id:"c"+(++S.n), t:"bolla", a:x.a||null, txt:`In bolla ma non arrivati: ${x.q} ${x.code} (${x.of}, DDT ${d.num})`}));
  log(`Chiude il DDT ${d.num}: un carico al gestionale`+(d.lines.some(l=>l.ferma)?"; la riga ferma avrà un carico suo":""), "DDT "+d.num);
  S.coda_out.unshift({txt:`Carico del DDT ${d.num}`, stato: S.online?"inviato":"in coda"}); }

/* ===== Articolo nuovo ===== */
V.nuovo = () => {
  const N = S.newArt, d = ddt();
  const steps = `<div class="steps">${[0,1,2,3].map(s=>`<i class="${s<=N.step?"on":""}"></i>`).join("")}</div>`;
  if(N.step===0){
    const righe = Object.entries(S.ofs).filter(([k,o])=>o.forn===d.forn).flatMap(([k,o])=>o.righe.map((r,ri)=>({k,r,ri}))).filter(x=>!x.r.a);
    return `${hdr("Articolo nuovo","Prima le righe che lo aspettano")}<main class="main">${steps}
      <p class="muted">Negli ordini di ${esc(d.forn)} ci sono righe senza articolo a catalogo. Se la scatola è una di queste, codice e descrizione sono già pronti.</p>
      <div class="list">${righe.map(x=>row(`${esc(x.r.code)} · ${esc(x.r.desc)}`,`${x.r.q} attesi`,"part",`nuovo:of:${x.k.replace(" ","_")}:${x.ri}`,x.k)).join("")}</div>
      <button class="btn" data-act="nuovo:libero">Nessuna di queste</button></main>`;
  }
  if(N.step===1){
    const shots=["davanti","etichetta con il codice","un altro lato"];
    return `${hdr(N.agg?"Aggiungi foto":"Articolo nuovo","Tre foto guidate")}<main class="main">${steps}
      <div class="cam"><div class="frame big">Foto ${Math.min(N.shots+1,3)} di 3: ${shots[Math.min(N.shots,2)]}<br>metti la scatola nel riquadro</div></div>
      ${N.blur?`<div class="warnbox">La foto è mossa: rifalla tenendo fermo il telefono.</div>`:""}
      <div class="btns two"><button class="btn" data-act="shotBlur">Scatta (esce mossa)</button><button class="btn go" data-act="shot">Scatta</button></div>
      ${N.shots>=1?`<button class="btn" data-act="shotsDone">${N.shots>=3?"Avanti":"Salta le altre e vai avanti"}</button>`:`<p class="muted">La prima foto è obbligatoria.</p>`}
      <div class="chips">${shots.map((s,i)=>`<span class="tag ${i<N.shots?"ok":""}">${i<N.shots?"✓ ":""}${s}</span>`).join("")}</div></main>`;
  }
  if(N.agg) return `${hdr("Aggiungi foto",N.code)}<main class="main"><div class="warnbox ok">${N.shots} foto aggiunte a ${esc(N.code)}. Diventano foto di riferimento con le loro regole.</div><button class="btn go" data-act="back">Fatto</button></main>`;
  if(N.step===2){
    const words=["Valvola","sfera","3/4\"","leva","gialla","ottone","PN25"];
    return `${hdr("Articolo nuovo","Dati")}<main class="main">${steps}
      <div class="field"><label for="nc">Codice letto dalla foto (correggibile)</label><input id="nc" type="text" value="${esc(N.code)}"></div>
      <div class="field"><label for="nd">Descrizione</label><input id="nd" type="text" value="${esc(N.desc)}"></div>
      <p class="muted">Parole lette sull'etichetta, tocca per aggiungerle:</p>
      <div class="chips">${words.map(w=>`<button class="chip" data-act="word:${esc(w)}">${esc(w)}</button>`).join("")}</div>
      <div class="field"><label for="nu">Unità di magazzino</label><select id="nu"><option selected>pezzo</option><option>metro</option><option>chilo</option></select></div>
      <p class="muted">Fornitore: ${esc(d.forn)} (dal DDT). Ubicazione abituale, prezzi e «si tiene a magazzino» li completa il responsabile.</p>
      <button class="btn go" data-act="datiOk">Avanti</button></main>`;
  }
  return `${hdr("Articolo nuovo","Prima di salvare")}<main class="main">${steps}
    <h3 style="margin:0">È uno di questi?</h3><p class="muted">Ho cercato in tutto il catalogo con codice, descrizione e aspetto.</p>
    <div class="list">${pick("V12","simile:V12")}${pick("V13","simile:V13")}</div>
    <button class="btn go" data-act="salvaNuovo">No, è un articolo nuovo</button>
    <p class="muted">Se ne scegli uno non creo niente: foto e codice nuovo si collegano a quell'articolo, da confermare.</p></main>`;
};

function catItems(c){
  if(c==="ddt") return S.ddts.map(d=>({doc:"DDT "+d.num, l:`DDT ${esc(d.num)} · ${esc(d.forn)}`, r:d.open?"aperto":"chiuso", small:`del ${d.data}${d.foto?" · foto della bolla":""}`, cls:d.open?"part":"done"}));
  if(c==="prep") return Object.entries(S.ordini).filter(([k,o])=>o.stato!=="aperto").map(([k,o])=>({doc:"Ordine "+k, l:`Ordine ${k} · ${esc(o.cli)}`, r:o.stato, small:`${o.colli} colli · preparato da ${o.prep}`, cls:"done"}));
  if(c==="sped") return S.ritiri.map(x=>({doc:x.id, l:`${S.cour[x.cour]} · ${x.day}`, r:`${x.ord.length} ordini`, small:`segnati da ${x.who}: ${x.ord.join(", ")}`, cls:"done"}));
  if(c==="vend") return S.venduteOk.map(v=>({doc:"Vendita "+v.id, l:`Vendita ${v.id} · ${esc(v.cli)}`, r:`${v.righe.length} articoli`, small:`${v.who}, ${v.at}`, cls:"done"}));
  if(c==="resi") return [...S.resiF.map(r=>({doc:null, l:`${r.id} · al fornitore ${esc(r.forn)}`, r:(RSTATI.find(x=>x[0]===r.stato)||["","rifiutato"])[1], small:r.righe.map(x=>x.q+" "+A(x.a).code).join(", "), cls:r.stato==="partito"?"done":"part"})), ...S.resiC.filter(r=>r.stato==="chiuso").map(r=>({doc:null, l:`Reso dall'ordine ${r.ord} · ${esc(r.cli)}`, r:"chiuso", small:`${nr(r.righe.reduce((n,x)=>n+x.esiti.length,0),"pezzo","pezzi")} · ${r.who}`, cls:"done"}))];
  if(c==="inv") return S.inv.filter(I=>!I.libera).map(I=>{ const n=I.ubi.filter(u=>u.stato==="contata").length; return {doc:null, l:`Inventario ${esc(I.t)}`, r:I.chiuso?"chiuso":"aperto", small:`${n} di ${I.ubi.length} ubicazioni contate · ${nr(I.diff.length,"differenza","differenze")} · creato da ${I.creato}${I.chiuso?" · chiuso il "+I.chiuso:""}`, cls:I.chiuso?"done":"part"}; });
  if(c==="corr") return S.log.filter(e=>/Conteggio|Annulla|Correzione|danneggiat/i.test(e.txt)).map(e=>({doc:null, l:esc(e.txt), r:e.at, small:e.who}));
  return S.coda_out.map(x=>({doc:null, l:esc(x.txt), r:x.stato, cls:x.stato==="inviato"?"done":"part"}));
}

function inConta(u){ for(const I of S.inv){ if(I.chiuso) continue; const x=I.ubi.find(z=>z.u===u && z.stato==="inconta"); if(x && x.who!==me()) return x; } return null; }
const invPend = I => I.diff.filter(d=>d.stato==="da approvare");
const invCount = () => isBoss() ? S.inv.reduce((n,I)=>n+invPend(I).length,0)
  : S.inv.filter(I=>!I.chiuso && !I.libera).reduce((n,I)=>n+I.ubi.filter(u=>(u.ass===me() && u.stato!=="contata") || (u.stato==="inconta" && u.who===me())).length,0);
const signed = n => (n>0?"+":n<0?"−":"")+Math.abs(n);

  if(!n){ if(c) S.controlli=S.controlli.filter(z=>z!==c); return; }
  const txt=`Inventario ${I.t.toLowerCase()}: ${nr(n,"differenza","differenze")} da approvare`; c ? c.txt=txt : S.controlli.push({id:"c"+(++S.n), t:"inv", inv:I.id, txt}); }
V.inv = () => { const open=S.inv.filter(I=>!I.chiuso && !I.libera);

  return `${hdr("Inventario")}<main class="main">${toastHtml()}${sospesi(items,"Nessuna ubicazione in conta in questo momento.")}
  <h2>Inventari aperti</h2><div class="list">${open.map(I=>{ const n=I.ubi.filter(u=>u.stato==="contata").length, mine=I.ubi.filter(u=>u.ass===me()&&u.stato!=="contata").length, p=invPend(I).length;
    return row(`Inventario ${esc(I.t)}`, `${n} di ${I.ubi.length}`, p&&isBoss()?"boss":"", "inv:"+I.id, `entro ${I.entro} · ${esc(I.cosa)}${mine?` · ${nr(mine,"ubicazione tua","ubicazioni tue")}`:""}${isBoss()&&p?` · ${nr(p,"differenza","differenze")} da approvare`:""}`); }).join("") || `<p class="muted">Nessun inventario aperto.</p>`}</div>

/* ===== Responsabile ===== */
V.controlli = () => `${hdr("Da controllare",`${myCtl().length} · ${[isBoss()?"magazzino":"",canPlan()?"piani":""].filter(Boolean).join(" e ")}`)}<main class="main">${toastHtml()}<div class="list">
  ${myCtl().map(c=>row(esc(c.txt),"›",c.t==="cdiff"||c.t==="unit"||c.t==="dmg"?"halt":c.t==="nuovo"?"part":c.t==="inv"?"boss":"",c.t==="inv"?"invDiff:"+c.inv:"ctl:"+c.id)).join("") || `<p class="muted">Niente da controllare.</p>`}</div></main>`;
SH.ctl = ({id}) => { const c=S.controlli.find(x=>x.id===id); const b = (t,cls="")=>`<button class="btn ${cls}" data-act="ctlDone:${id}:${esc(t)}">${t}</button>`;
  const opts = {
    senza:[b("Tieni: va in ubicazione e diventa libera","go"),b("Rendi al fornitore")],
    conta:[b("Va bene","go"),b("Ricontrolla: chiedi un nuovo conteggio")],
    cdiff:[b("Carica sull'articolo a catalogo","go"),b("Aspetto: aggiorno il codice nel gestionale")],
    unit:[b("Approva la conversione","go")],
    nuovo:[b("Conferma (dopo aver completato i dati)","go"),b("Unisci a un articolo esistente"),`<button class="btn bad" data-act="sheet:grave:${id}:rifiuta">Rifiuta</button>`],
    collega:[b("Conferma il collegamento","go"),b("Rifiuta: elenca i carichi da correggere","bad")],
    dmg:[b("Tieni: torna merce buona","go"),b("Rendi al fornitore"),`<button class="btn bad" data-act="sheet:grave:${id}:scarta">Scarta</button>`],
    bolla:[b("Va bene così","go"),`<button class="btn boss" data-act="sheet:segnala:${id}">Scrivi al fornitore</button>`],
    bollaAtt:[b("Manda il mancante: il residuo resta aperto","go"),b("Nota di credito: il residuo si chiude"),b("Pezzi in più: rendi al fornitore"),b("Pezzi in più: teniamo")],
    noord:[b("Ho creato l'ordine nel gestionale: la riga riparte","go"),b("Non c'è un ordine: è merce non prevista")],
    ecc:[b("Tieni l'eccedenza","go"),b("Rendi al fornitore")],
    prel:[b("Va bene: si cambia l'ordine nel gestionale","go"),b("Correggi: il di più torna a magazzino")],
    sosp:[b("Va bene","go"),b("Dallo a un altro preparatore")],
    arrivo:[`<button class="btn go" data-act="creaResto:${c.k}:${id}">Crea piano</button>`],
    resoc:[b("Rivendibile: torna libero","go"),b("Rendi al fornitore"),`<button class="btn bad" data-act="sheet:grave:${id}:scarta">Scarta</button>`],
    rifiuto:[b("Tieni: va in ubicazione e diventa libera","go"),`<button class="btn bad" data-act="sheet:grave:${id}:scarta">Scarta</button>`]
  }[c.t];
  return `<h3>${esc(c.txt)}</h3>${c.a?photo(A(c.a).photo):""}${c.t==="nuovo"?`<div class="list">${row("Ubicazione abituale","da scegliere","part")}${row("Prezzi","da completare","part")}${row("Si tiene a magazzino","sì")}</div>`:""}<div class="btns">${opts.join("")}</div>`; };
SH.grave = ({i, x}) => { const c=S.controlli.find(z=>z.id===i); const w = x==="scarta" ? "Scartare questa merce? Esce dal magazzino e al gestionale va uno scarico. Non si torna indietro." : "Rifiutare l'articolo? I carichi fatti con lui vanno corretti e la merce va resa o tenuta come merce non prevista (114).";
  return `<h3>${x==="scarta"?"Scarta":"Rifiuta"}</h3><p>${esc(c.txt)}</p><div class="warnbox bad">${w}</div>
  <div class="btns two"><button class="btn" data-act="closeSheet">Torna indietro</button><button class="btn bad" data-act="ctlDone:${i}:${x==="scarta"?"Scarta":"Rifiuta"}">${x==="scarta"?"Scarta":"Rifiuta"}</button></div>`; };
V.utenti = () => `${hdr("Utenti","Admin")}<main class="main"><div class="list">${USERS.map(u=>row(u.n,isResp(u)?u.perm.map(g=>PERM[g]).join(", "):"","","",["mansioni: "+u.m.map(x=>MANS[x]).join(", "), u.sped?"conferma le spedizioni":"", "lavori in più: "+((u.extra||[]).join(", ")||"nessuno"), u.perm.includes("mag")||u.perm.includes("admin")?(S.mail?"mail aziendale: anna@azienda.example":"mail aziendale: non indicata"):""].filter(Boolean).join(" · "))).join("")}</div>
  <h2>Permessi</h2><div class="list">${Object.values(PERM).map(t=>row(t,"")).join("")}${row("Conferma le spedizioni","")}</div>
  <button class="btn">Nuovo utente</button></main>`;
V.config = () => `${hdr("Configurazione")}<main class="main"><div class="warnbox boss">Segnaposto: la procedura guidata dell'installazione è ancora nella nebbia della mappa.</div><div class="list">
  ${[["Ubicazioni","sì"],["VEND","acceso"],["Posti VEND","numerati"],["Prezzi","accesi"],["Ordini parziali si prelevano","sì"],["Uscita dopo","30 min"],["Scambio ogni","5 min"],["«Vecchi» nelle cose in sospeso dopo","2 giorni"]].map(([a,b])=>row(a,b)).join("")}
  ${row("Inventario: quantità attesa a chi conta",S.cfgCieca?"nascosta":"visibile","","cfg:cieca","di serie nascosta (230)")}${row("Inventario: seconda conta se il numero non torna",S.cfgSec?"la stessa persona, subito":"spenta","","cfg:sec","di serie accesa (231)")}
  ${row("I preparatori vedono il lavoro dei colleghi",S.cfgColl?"sì":"no","","cfg:coll","in UFP sì (250)")}${row("Con la coda, i resti",S.cfgRestoCoda?"tornano in coda da soli":"passano dal responsabile","","cfg:resto","di serie da soli (296)")}${row("Ubicazione per gli ordini sospesi",S.cfgSosp?"accesa: si inquadra dove resta il pacco":"spenta: il pacco resta sul tavolo","","cfg:sosp","di serie spenta (247)")}</div>
  <p class="muted">Nel prototipo le ultime righe si toccano per cambiarle.</p></main>`;

/* ===== Preparazione e spedizione ===== */
const manca = o => o.righe.filter(r=>r.ass<r.q);
const avviso = (o, open) => { const m=manca(o); if(!m.length) return ""; return `<details class="exp" ${open?"open":""}><summary>⚠ ${nr(m.length,"articolo non basta","articoli non bastano")}</summary><div class="list">${m.map(r=>row(A(r.a).code, r.ass?`servono ${r.q} · disponibili ${r.ass}`:`servono ${r.q} · non c'è`, r.ass?"part":"halt")).join("")}</div></details>`; };
const giac = (k, scelta, act) => { const tot=(GU[k]||[]).reduce((n,x)=>n+x[1],0);
  return `<div class="grp-h"><span>Giacenze di ${A(k).code}</span><span>Giacenza ${tot} ${A(k).unit} · Disponibilità ${LIBERI[k]}</span></div><div class="list">${(GU[k]||[]).map(([u,q])=>row(`${u}${u===A(k).loc?" · abituale":u==="CHECK"?" · area di ricevimento":""}`, `${q} ${A(k).unit}`, act&&u===scelta?"boss":"", u===scelta||!act?"":act+u, !act?"":u===scelta?"da qui":"tocca per prendere da qui")).join("")}</div>`; };
const cop = o => { const t=o.righe.reduce((n,r)=>n+r.q,0), a=o.righe.reduce((n,r)=>n+r.ass,0); return a>=t?["completo","done"]:a>0?[`${a} di ${t}`,"part"]:["niente","dim"]; };
const ordRow = (k, act=true) => { const o=S.ordini[k]; const [t,c]=cop(o);
  if(o.stato!=="aperto") return row(`${k} · ${esc(o.cli)}`, o.stato==="pronto"?"pronto":"spedito", "done");
  if(o.da && o.da!==me()) return row(`${k} · ${esc(o.cli)}`, `in preparazione da ${o.da}`, "dim", "", `da ${o.age||"poco"}`);
  if(o.ferma) return row(`${k} · ${esc(o.cli)}`, "sospeso", "halt", act?"ord:"+k:"", `fermo: ${esc(o.ferma)}${o.posto?" · pacco in "+o.posto:""}`);
  return row(`${k} · ${esc(o.cli)}`, o.riprendi?"da riprendere":t, o.riprendi?"part":c, act?"ord:"+k:"", `${S.cour[o.cour]}${o.riprendi?" · "+esc(o.riprendi):o.da===me()?" · lo stai preparando tu":""}`); };
function prepSospesi(filter){ const items = Object.entries(S.ordini).filter(([k,o])=>o.stato==="aperto" && o.da && filter(o)).map(([k,o])=>({l:`${k} · ${esc(o.cli)}`, r:o.da===me()?"riprendi":o.da, cls:o.ferma?"halt":o.old?"dim":"part", act:o.da===me()?"ord:"+k:"", small:o.ferma?`fermo: ${esc(o.ferma)}${o.posto?" · pacco in "+o.posto:""}`:o.riprendi?`da riprendere: ${esc(o.riprendi)}`:o.da===me()?`preso da te ${o.age?o.age+" fa":"ora"}`:`preso da ${o.da} da ${o.age||"poco"}${o.old?" · chi pianifica lo può liberare":""}`, who:o.da, ferma:!!o.ferma, old:o.old}));
  return sospesi(items, "Nessun ordine preso e non finito."); }
V.preleva = () => {
  if(S.coda){ const q=Object.entries(S.ordini).filter(([k,o])=>o.shop&&o.stato==="aperto"&&!o.da);
    return `${hdr("Preleva","Coda degli ordini del sito")}<main class="main">${prepSospesi(o=>o.shop)}
    <h2>In coda</h2><div class="tile"><b>${q.length}</b><span>ordini pronti da prelevare</span></div>
    ${q.length?`<button class="btn go" data-act="prossimo">Prossimo ordine</button>`:`<p class="muted">La coda è vuota: nessun ordine pagato da preparare.</p>`}
    <p class="muted">Ti do l'ordine pronto più vecchio. Chi lo prende lo toglie dalla coda: nessun altro lo vede.</p></main>`; }
  const mine=S.piani.filter(p=>p.prep===me()), others=S.piani.filter(p=>p.prep!==me());
  const pr = p => row(`Piano «${esc(p.t)}»`, `${p.ord.filter(k=>S.ordini[k].stato==="aperto").length} da fare`, p.prep===me()?"boss":"", "piano:"+p.id, `${p.ord.length} ordini · ${p.prep}`);
  const coll = S.cfgColl || canPlan();
  return `${hdr("Preleva","Piani di spedizione")}<main class="main">${prepSospesi(o=>!o.shop && (coll || o.da===me()))}
    <h2>I tuoi piani</h2><div class="list">${mine.map(pr).join("") || `<p class="muted">Nessun piano dato a te.</p>`}</div>
    ${coll?`<h2>Piani dei colleghi</h2><div class="list">${others.map(pr).join("") || `<p class="muted">Nessun piano dei colleghi.</p>`}</div>
    <p class="muted">Puoi aiutare un collega prendendo un suo ordine non ancora aperto.</p>`:`<p class="muted">In questo magazzino il lavoro dei colleghi non si vede (250).</p>`}</main>`; };
V.piano = () => { const p=S.piani.find(x=>x.id===S.pianoSel);
  return `${hdr(`Piano «${esc(p.t)}»`,`di ${p.prep}`)}<main class="main"><div class="list">${p.ord.map(k=>ordRow(k)+(S.ordini[k].stato==="aperto"?avviso(S.ordini[k]):"")).join("")}</div>
  <p class="muted">Tocca un ordine per iniziare. Chi lo apre lo prende; uscendo a metà resta tuo, tra le cose in sospeso.</p></main>`; };
/* Elenco del prelievo (270–277): l'ordine si apre sull'elenco; in cima «Prelievo guidato» e «Sospendi»; toccando un articolo
   la riga si allarga con giacenze e tasti rapidi; «Correggi giacenza» al posto di «Ne trovo di più/meno» (273, regole 256) */
const isDone = r => r.preso!==undefined || !!r.senza;
const whereOf = R => R.vend || R.u || A(R.a).loc;
const AREA_RIC = "CHECK"; /* nome dell'area di ricevimento, scelto alla configurazione (in UFP «CHECK», 297) */
const gq = (a, u) => ((GU[a]||[]).find(x=>x[0]===u)||[0,0])[1];
function pickRows(o){ const k=r=>(r.ass===0?"2":r.dopo?"1":"0")+whereOf(r); return o.righe.map((r,i)=>({...r,i})).sort((x,y)=>k(x).localeCompare(k(y))); }
const pending = o => pickRows(o).filter(r=>!isDone(r));
function curRow(o){ const P=S.pk; if(P.cur!=null && !isDone(o.righe[P.cur])) return P.cur; P.cur=null; if(P.mode!=="guided") return null; const p=pending(o); return p.length ? (P.cur=p[0].i) : null; }
const qtyTxt = R => R.ass===0 ? "non risulta" : R.ass<R.q ? `${R.ass} di ${R.q}` : `${R.q} ${A(R.a).unit}`;
const liRow = (o, i) => { const R=o.righe[i], w=whereOf(R), ic=inConta(w), open=S.pk.open===i;
  const small = [esc(A(R.a).desc), R.vend?"merce venduta":"", ic?`in conta da ${ic.who}`:""].filter(Boolean).join(" · ");
  return `<button class="row ${R.ass===0?"halt":R.ass<R.q?"part":""}" data-act="liPick:${i}"><span class="l"><span><b>${w}</b> · ${A(R.a).code}</span><small>${small}</small></span><span class="r">${qtyTxt(R)}</span></button>`; };
const pkHdr = (k, sub) => `<header class="top"><button class="ic" data-act="pkList" aria-label="Torna all'elenco">‹</button><h1>Ordine ${k}<small>${sub}</small></h1></header>`;
V.pick = () => { const k=S.ordine, o=S.ordini[k], P=S.pk, tot=o.righe.length, fatti=o.righe.filter(isDone).length;
  if(P.mode==="fine") return V.fine();
  if(P.mode==="rimetti") return V.rimetti(o, k, P.cur);
  if(P.mode==="list") return V.pickList(o, k, tot, fatti);
  const i = curRow(o);
  if(i==null){ if(P.mode==="guided"){ P.mode="fine"; return V.fine(); } P.mode="list"; return V.pickList(o, k, tot, fatti); }
  const R=o.righe[i], w=whereOf(R), ic=P.st===0 && inConta(w), guided=P.mode==="guided", last=guided && pending(o).length===1;
  const avanti = guided && !last ? "Prosegui" : "Concludi senza"; /* 272 */
  const sub = guided ? `Prelievo guidato · ${fatti+1} di ${tot}` : esc(o.cli);
  const corr = `<button class="btn small" data-act="sheet:corr:${i}">Correggi giacenza</button>`;
  const head = `<div class="row boss"><span class="l"><span><b>${w}</b> · ${A(R.a).code}</span><small>${esc(A(R.a).desc)}${R.vend?" · merce venduta":""}</small></span><span class="r">${R.ass===0?"non risulta":R.ass<R.q?`prendi ${R.ass} di ${R.q}`:`prendi ${R.ass}`}</span></div>`;
  const g = R.vend ? `<div class="warnbox boss">Merce venduta: solo da ${R.vend}</div>` : giac(R.a, w, "pkUbi:");
  if(R.ass===0) return `${pkHdr(k, sub)}<main class="main">${toastHtml()}${head}
    <div class="warnbox bad">Non risulta. Se lo trovi, correggi la giacenza.</div>${g}${corr}
    <div class="btns two"><button class="btn" data-act="sheet:sosp">Sospendi</button><button class="btn go" data-act="senza:${i}">${avanti}</button></div>
    <p class="muted">${avanti==="Prosegui"?"«Prosegui»: passi al prossimo articolo; questo resta aperto e parte appena arriva (248).":"«Concludi senza»: questo articolo resta aperto e parte appena arriva (248)."} «Sospendi»: l'ordine si ferma finché arriva (247).</p></main>`;
  const ric = w===AREA_RIC;
  const stepTxt = P.st===0?`Vai a <b>${w}</b> e scansiona l'ubicazione`:ric?`Area di ricevimento: inquadra <b>${A(R.a).code}</b> o confermalo a mano`:`Inquadra <b>${A(R.a).code}</b>`;
  const short = R.ass<R.q;
  return `${pkHdr(k, sub)}<main class="main">${toastHtml()}${head}${g}
    ${ic?`<div class="warnbox">${w} in conta da ${ic.who}. Prendi da un'altra ubicazione.</div>${guided?`<button class="btn small" data-act="later:${i}">Più tardi</button>`:""}`:""}
    ${P.st<2?`<div class="cam"><div class="frame">${stepTxt}</div><div class="chips">${P.st===0?`<button class="chip" data-act="pkLoc:ok">Simula: ${w}</button><button class="chip" data-act="pkLoc:no">Simula: un'altra ubicazione</button>`:`<button class="chip" data-act="pkArt:ok">Simula: ${A(R.a).code}</button><button class="chip" data-act="pkArt:no">Simula: un altro articolo</button>`}</div></div>${ric&&P.st===1?`<button class="btn" data-act="pkArt:mano">Conferma a mano</button>`:""}`:
     `<div class="field"><label for="q">Quanti ne prendi?</label><div class="qty"><button class="ic" data-act="qm" aria-label="Meno">−</button><input id="q" type="number" inputmode="numeric" value="${R.ass}"><button class="ic" data-act="qp" aria-label="Più">+</button></div></div>
     ${short?`<div class="warnbox">Ne servono ${R.q}, ne risultano ${R.ass}.</div><div class="btns two"><button class="btn" data-act="sheet:sosp">Sospendi</button><button class="btn go" data-act="pkQty:senza">${avanti}</button></div>`:`<button class="btn go" data-act="pkQty">Preso</button>`}`}
    ${P.warn?`<div class="warnbox bad">${P.warn}</div>`:""}
    ${corr}
    <button class="btn" data-act="sheet:cerca">Cerca</button>
    ${short&&P.st===2?`<p class="muted">${avanti==="Prosegui"?"«Prosegui»: prendi quelli che ci sono e passi al prossimo; il resto parte appena arriva (248).":"«Concludi senza»: prendi quelli che ci sono; il resto parte appena arriva (248)."} «Sospendi»: l'ordine si ferma finché arriva (247).</p>`:""}
    <p class="muted">${guided?"Prelievo guidato: un articolo dopo l'altro, in ordine di ubicazione. ‹ torna all'elenco.":"Dopo «Preso» torni all'elenco."} «Correggi giacenza»: scrivi quanti pezzi ci sono nell'ubicazione e continui da qui (256).${guided?" «Più tardi», con l'ubicazione in conta: l'articolo passa in fondo (275).":""}</p></main>`; };
/* Rimetti a posto (295): torna dove era stato preso; se era nell'area di ricevimento, va nella sua ubicazione abituale */
const backTo = R => { const d=R.da||whereOf(R); return d===AREA_RIC ? A(R.a).loc : d; };
V.rimetti = (o, k, i) => { const R=o.righe[i], w=backTo(R);
  return `${pkHdr(k, "Rimetti a posto")}<main class="main">${row(`<b>${w}</b> · ${A(R.a).code}`, `${R.preso} ${A(R.a).unit}`, "boss", "", esc(A(R.a).desc))}
    <div class="cam"><div class="frame">Riporta ${R.preso} ${A(R.a).code} in <b>${w}</b> e scansiona l'ubicazione</div><div class="chips"><button class="chip" data-act="rimOk:${i}:scan">Simula: ${w}</button></div></div>
    <button class="btn" data-act="rimOk:${i}:mano">Conferma a mano</button>
    <p class="muted">Scansionando l'ubicazione il ritorno si conferma da solo; l'articolo torna da prendere (295).</p></main>`; };
V.pickList = (o, k, tot, fatti) => { const P=S.pk, pend=pending(o), done=pickRows(o).filter(isDone);
  /* 281: «Restano aperti» con quello che manca; in «Presi» solo ciò che si è preso davvero */
  const aperti=done.filter(r=>r.senza && (r.preso||0)<r.q), presi=done.filter(r=>(r.preso||0)>0);
  return `${hdr(`Ordine ${k}`, `${esc(o.cli)} · ${fatti} di ${tot}`, {right:`<button class="ic" data-act="liCam" aria-label="Inquadra un articolo" aria-pressed="${!!P.cam}">📷</button>`})}<main class="main">
    ${pend.length?`<div class="btns two"><button class="btn go" data-act="guida">Prelievo guidato</button><button class="btn" data-act="sheet:sosp">Sospendi</button></div>`:`<button class="btn go" data-act="pkFine">Fine preparazione</button>`}
    ${P.cam?`<div class="cam"><div class="frame">Inquadra un articolo dell'ordine</div><div class="chips"><button class="chip" data-act="liScan:SF09">Simula: SF-09</button><button class="chip" data-act="liScan:V13">Simula: VT-1201</button></div></div>`:""}
    ${P.warn?`<div class="warnbox bad">${P.warn}</div>`:""}${toastHtml()}
    ${pend.length?`<h2>Da prendere (${pend.length})</h2><div class="list">${pend.map(r=>liRow(o,r.i)).join("")}</div>`:""}
    ${aperti.length?`<h2>Restano aperti (${aperti.length})</h2><div class="list">${aperti.map(r=>{ const R=o.righe[r.i]; return row(`<b>${whereOf(R)}</b> · ${A(R.a).code}`, `${R.q-(R.preso||0)} ${A(R.a).unit}`, "part", "", esc(A(R.a).desc)); }).join("")}</div>`:""}
    ${presi.length?`<details class="exp" ${P.presiOpen?"open":""}><summary data-act="presiTog">Presi (${presi.length})</summary><div class="list">${presi.map(r=>{ const R=o.righe[r.i], open=P.open===r.i;
      return `<button class="row ${open?"sel ":""}${R.preso>=R.q?"done":"part"}" data-act="liOpen:${r.i}" aria-expanded="${open}"><span class="l"><span><b>${R.da||whereOf(R)}</b> · ${A(R.a).code}</span><small>${esc(A(R.a).desc)}</small></span><span class="r">${R.preso}${R.preso<R.q?" di "+R.q:""}</span></button>`
        + (open?`<div class="rexp"><div class="btns two"><button class="btn bad" data-act="presoDel:${r.i}">Elimina</button><button class="btn" data-act="presoBack:${r.i}">Rimetti a posto</button></div></div>`:""); }).join("")}</div></details>`:""}
    <p class="muted">Tocca un articolo per entrarci: lì scegli la giacenza e la quantità (293, 294). «Prelievo guidato» ti porta da un articolo all'altro, in ordine di ubicazione. Con 📷 inquadri un articolo ed entri nel suo (276). Toccando un articolo preso: «Elimina» toglie il prelievo, «Rimetti a posto» ti porta alla sua ubicazione (295). Se esci, l'ordine resta tuo, tra le cose in sospeso.</p></main>`; };
SH.qConf = ({i, x}) => { const o=S.ordini[S.ordine], R=o.righe[curRow(o)], q=+i;
  return `<h3>Prendi ${q} ${A(R.a).code}?</h3><div class="warnbox">${R.ass<R.q?`Proposti ${R.ass}, ne servono ${R.q}`:`Ne servono ${R.q}`}${q<R.q?`: restano aperti ${R.q-q}`:q>R.q?`: ${q-R.q} in più`:""}.</div>
  <div class="btns two"><button class="btn" data-act="closeSheet">Cambia</button><button class="btn go" data-act="pkQtyOk:${q}:${x||""}">Prendi ${q}</button></div>`; };
SH.corr = ({i}) => { const o=S.ordini[S.ordine], R=o.righe[+i], w=whereOf(R);
  return `<h3>Correggi giacenza · ${A(R.a).code}</h3>

/* ===== Disegno ===== */
function render(){
  const app = document.getElementById("app");
  /* Interfaccia pulita (262, 266): le frasi di spiegazione vanno nell'ⓘ del titolo; avvisi e stati vuoti restano visibili */
  const keep = t => /^\s*(Nessun|Nessuna|Ancora|Niente)/.test(t) || t.replace(/<[^>]+>/g,"").length<=45;
  const tips=[]; let view = (V[S.screen]||V.home)().replace(/<p class="muted"( style="[^"]*")?>([\s\S]*?)<\/p>/g,(m,st,t)=> keep(t)?m:(tips.push(t),""));
  if(tips.length){ view = view.replace("</h1>", `</h1><button class="ic" data-act="info" aria-label="Come funziona" aria-expanded="${!!S.info}">ⓘ</button>`);
    if(S.info) view = view.replace("</header>", `</header><div class="tipbox">${tips.map(t=>`<p>${t}</p>`).join("")}</div>`); }
  const tipSheet = h => h.replace(/<p class="muted"( style="[^"]*")?>([\s\S]*?)<\/p>/g,(m,st,t)=> keep(t)?m:`<details class="tip"><summary aria-label="Come funziona">ⓘ</summary><p>${t}</p></details>`);
  const offline = !S.online ? `<div class="banner bad">Rete assente: il lavoro è fermo. ${S.pendingOffline} letture salvate sul telefono, partiranno appena torna la rete.</div>` : "";
  app.innerHTML = `<div class="proto"><span>PROTOTIPO · dati inventati${S.user?` · ${S.user.n}`:""}</span><button data-act="go:scenari">Scenari</button></div>${offline}${view}
    <details class="log"><summary>Tutto quello che è successo, per chi prova (${S.log.length})</summary><ol>${S.log.slice(0,30).map(e=>`<li>${e.at} · ${esc(e.who)}: ${esc(e.txt)}</li>`).join("")}</ol></details>
    ${S.sheet?`<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${(h=>/data-act="(closeSheet|home|back)"/.test(h)?h:h+`<button class="btn" data-act="closeSheet">Annulla</button>`)(tipSheet(SH[S.sheet.sk](S.sheet)))}</div></div>`:""}`;
  numInputs();
}

/* ===== Tastierino del programma (284, 290, 291) ===== */
const KPI = `<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="1" y="1" width="16" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="4" width="10" height="4" fill="currentColor"/><circle cx="5.5" cy="12" r="1.3" fill="currentColor"/><circle cx="9" cy="12" r="1.3" fill="currentColor"/><circle cx="12.5" cy="12" r="1.3" fill="currentColor"/><circle cx="5.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="9" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12.5" cy="15.5" r="1.3" fill="currentColor"/></svg>`;
function numInputs(){ document.querySelectorAll('#app input[type=number], #app input#kg').forEach(inp=>{
  if(S.pc){ if(!inp.nextElementSibling || !inp.nextElementSibling.classList.contains("kp-ic")) inp.insertAdjacentHTML("afterend", `<button type="button" class="ic kp-ic" data-kpfor="${inp.id}" aria-label="Apri il tastierino">${KPI}</button>`); }
  else { inp.readOnly=true; inp.inputMode="none"; inp.dataset.kp="1"; } }); }
function keypad(inp){ const dec = inp.id==="kg"; const lab = (inp.closest(".field")?.querySelector("label")?.textContent) || "Quantità";
  let v=String(inp.value), fresh=true; const bg=document.createElement("div"); bg.className="sheet-bg kp-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Tastierino"><h3>${esc(lab)}</h3><div class="kp-val" aria-live="polite"></div><div class="keys">${["1","2","3","4","5","6","7","8","9",dec?",":"","0","⌫"].map(k=>k?`<button class="key" data-k="${k}" aria-label="${k==="⌫"?"Cancella":k}">${k}</button>`:"<span></span>").join("")}</div><div class="btns two"><button class="btn" data-k="esc">Annulla</button><button class="btn go" data-k="ok">OK</button></div></div>`;
  const show=()=>{ bg.querySelector(".kp-val").textContent = v || "0"; }; show();
  bg.addEventListener("click", e=>{ e.stopPropagation(); const b=e.target.closest("[data-k]"); if(!b){ if(e.target===bg) bg.remove(); return; } const k=b.dataset.k;
    if(k==="esc") return bg.remove(); if(k==="ok"){ inp.value=v; bg.remove(); return inp.focus({preventScroll:true}); }
    if(k==="⌫") v = fresh ? "" : v.slice(0,-1); else { if(fresh) v=""; if(k===","&&v.includes(",")) return; v=(v+k).slice(0,7); }
    fresh=false; show(); });
  document.body.appendChild(bg); bg.querySelector('[data-k="ok"]').focus(); }
document.addEventListener("click", e=>{ const t=e.target.closest("input[data-kp], [data-kpfor]"); if(!t) return; e.preventDefault(); keypad(t.dataset.kpfor?document.getElementById(t.dataset.kpfor):t); });

/* ===== Azioni ===== */
function invReg(a, q){ const U=curUbi(), g=expQ(U.u,a), r=U.righe.find(z=>z.a===a);
  if(invSec() && q!==g && !(r && r.q1!==undefined)) return sheet("invRic",{i:a, x:q});
  r ? (r.q=q) : U.righe.push({a,q}); log(`${A(a).code} in ${U.u}: contati ${q}`, "Inventario "+curInv().t);
  S.sheet=null; S.toast={txt:`♪ ${q} ${A(a).code} contati in ${U.u}`}; return render(); }
function sheet(sk, extra={}){ S.sheet = Object.assign({}, extra, {sk}); render(); }
const ofk = s => s ? s.replace("_"," ") : s;
function act(a, el){
  const [c, x, y, ...rest] = a.split(":");
  switch(c){
    case "back": return back();
    case "info": S.info=!S.info; return render();
    case "home": S.stack=[]; return go("home", false);
    case "go": if(x==="chiudi"){ if(!ddt().lines.length){ S.toast={txt:"Il DDT non ha ancora righe: niente da chiudere."}; return render(); } return go("chiudi"); }
      if(x==="banco") S.banco=null; if(x==="documenti"){ S.docTab="doc"; S.docCat=null; } return go(x);
    case "primoOk": S.firstRun=false; S.stack=[]; return go(S.user?"home":"accesso", false);
    case "camNo": return go("camNo");
    case "who": S.pinFor=x; S.pin=""; return go("pin");
    case "key": if(x==="⌫") S.pin=S.pin.slice(0,-1); else if(S.pin.length<6) S.pin+=x; if(S.pin.length===6) return act("login"); return render();
    case "login": { S.user=USERS.find(u=>u.n===S.pinFor); log(`Accesso`); S.stack=[]; const r=S.resume; S.resume=null; if(r){ S.screen=r; S.stack=["home"]; log("Ripreso il lavoro lasciato a metà"); return render(); } return go("home", false); }
    case "esci": log(`Uscita`); S.user=null; S.stack=[]; return go("accesso", false);
    case "updNow": S.update=false; log("Aggiornamento programmato per stasera, dopo la copia di sicurezza"); return render();
    case "updLater": S.update=false; return render();
    case "syncNow": S.sync=true; log("Aggiorna ora: scambio riuscito, coda vuota"); return render();
    case "ddt": S.lastDdt=+x; return go("ddt");
    /* Nuovo DDT */
    case "ndStart": S.nd={step:0, forn:null, num:"", data:"", ofCit:"", foto:false, letto:null, dup:null}; return go("nuovoDdt");
    case "ndForn": S.nd.forn=[x,y,...rest].filter(Boolean).join(":"); S.nd.step=1; return render();
    case "ndFoto": S.nd.foto = x!=="skip"; S.nd.letto = x==="ok" ? true : x==="no" ? false : null;
      if(x==="ok"){ S.nd.num = S.nd.forn==="Idrotecnica Nord" ? "698/00" : "2310"; S.nd.data="18/11/2026"; S.nd.ofCit = S.nd.forn==="Idrotecnica Nord" ? "OF 1210" : ""; }
      S.nd.step=2; render(); return window.scrollTo(0,0);
    case "ndAnnulla": S.nd=null; return back();
    case "ndApri": { const N=S.nd; N.num=document.getElementById("num").value.trim(); N.data=document.getElementById("dat").value.trim(); N.ofCit=document.getElementById("ofc").value;
      if(!N.num){ S.nd.letto=false; return render(); }
      const dup=S.ddts.find(d=>d.forn===N.forn && d.num===N.num);
      if(dup && N.dup!==dup.id){ N.dup=dup.id; return render(); }
      const id=Date.now(); S.ddts.push({id, num:N.num, forn:N.forn, data:N.data||"18/11/2026", open:true, foto:N.foto, ofCit:N.ofCit||null, who:me(), age:"ora", lines:[]}); S.lastDdt=id;
      log(`Apre il DDT ${N.num} di ${N.forn}${N.foto?", foto della bolla salvata":", senza foto"}${N.letto?"; numero e data letti dalla foto, confermati":""}${N.rov?`; collo rovinato all'arrivo, foto salvata, ${N.ris==="si"?"firmato con riserva":"senza riserva"}`:""}`, "DDT "+N.num);
      S.nd=null; S.stack=S.stack.filter(s=>s!=="nuovoDdt"); S.screen="ricevi"; return go("ddt"); }
    /* Dalla bolla, ordine mancante, segnalazione (223, 224) */
    case "noOrdOk": { const d=ddt(), q=+document.getElementById("noq").value; if(!q){ S.toast={txt:"Scrivi quanti ne hai contati"}; S.sheet=null; return render(); }
      d.lines.push({a:"G44", of:"ordine mancante", cnt:q, lastQ:q, ferma:"ordine mancante: il responsabile crea l'ordine nel gestionale, poi la riga riparte"});
      S.controlli.push({id:"c"+(++S.n), t:"noord", a:"G44", q, txt:`DDT ${d.num}: ${q} GT-4410 senza ordine aperto, l'operatore dice che manca l'ordine`});
      log(`${q} GT-4410 contati senza ordine: riga ferma, al responsabile`, "DDT "+d.num); S.sheet=null; S.toast={txt:`♪ ${q} GT-4410 contati: la riga aspetta l'ordine, continua con le altre scatole`}; return render(); }
    case "segnalaOk": { const c=S.controlli.find(z=>z.id===x); c.t="bollaAtt"; c.txt=c.txt+" · scritto al fornitore, si aspetta la risposta"; S.sheet=null;
      log(y==="copia"?`Differenze di ${c.ddt||"un DDT"}: testo copiato, la mail la manda il responsabile`:`Differenze di ${c.ddt||"un DDT"} scritte al fornitore dalla mail aziendale di ${me()}`); S.toast={txt:"Scritto al fornitore: quando risponde, tocca la riga e segna la risposta"}; return render(); }

    case "pkBack": Object.assign(S.pk,{mode:"list", cur:null, st:0}); return render();
    case "resta": S.resta=S.resta||{}; S.resta[x]=!S.resta[x]; return render();
    case "ritirato": { const ks=Object.keys(S.ordini).filter(k=>S.ordini[k].stato==="pronto"&&S.ordini[k].cour===x&&!(S.resta||{})[k]); ks.forEach(k=>S.ordini[k].stato="spedito"); const id=`Ritiro ${x} 18/11 ${clock()}`; S.ritiri.unshift({id, cour:x, day:"18/11", ord:ks, who:me()});
      log(`Ritirato da ${S.cour[x]}: spediti ${ks.join(", ")}; spedizione al gestionale${S.coda?" e a Shopify":""}`, id); S.sheet=null; S.toast={kind:"ship", txt:`Spediti ${ks.length} ordini con ${S.cour[x]}`, ks}; return render(); }
    case "creaResto": { S.npResto=x; if(y){ S.controlli=S.controlli.filter(z=>z.id!==y); S.sheet=null; } return go("nuovoPiano"); }
    case "creaPiano": { const rs=[...document.querySelectorAll("[data-resto]")].filter(i=>i.checked).map(i=>i.dataset.resto);
      rs.forEach(k=>{ const r=S.resti.find(z=>z.k===k); r.piano=true; const o0=S.ordini[k]; S.ordini[k+" resto"]={cli:r.cli, cour:o0?o0.cour:"BRT", stato:"aperto", resto:true, righe:r.righe.map(x=>({a:x.a,q:x.q,ass:x.q}))}; });
      const ks=[...document.querySelectorAll("[data-ord]")].filter(i=>i.checked).map(i=>i.dataset.ord).concat(rs.map(k=>k+" resto")); if(!ks.length) return; S.npResto=null; const t=document.getElementById("pt").value, pp=document.getElementById("pp").value; S.piani.push({id:"pn"+(++S.n), t, prep:pp, ord:ks}); log(`Crea il piano «${t}» per ${pp}: ${ks.join(", ")}`); return back(); }
    case "sc":
      if(x==="rete"){ S.online=!S.online; log(S.online?`Rete tornata: partite ${S.pendingOffline} letture`:"Rete assente"); if(S.online) S.pendingOffline=0; return back(); }
      if(x==="timeout"){ if(!S.user) return back(); S.resume=S.stack[S.stack.length-1]||"home"; log(`Uscita automatica dopo 30 minuti senza uso: il lavoro a metà resta`); S.user=null; S.stack=[]; return go("accesso", false); }
      if(x==="sync"){ S.sync=!S.sync; return back(); }
      if(x==="coda"){ S.coda=!S.coda; log(S.coda?"Ora il magazzino lavora con la coda":"Ora il magazzino lavora con i piani"); S.stack=[]; return go(S.user?"home":"accesso", false); }
      if(x==="vuoti"){ S.ddts.forEach(d=>d.open=false); S.area=[]; S.rimetti=[]; S.vendite=[]; S.controlli=[]; Object.values(S.ordini).forEach(o=>{ if(o.stato!=="spedito"){ o.stato="spedito"; o.da=null; } }); log("Scenario: elenchi svuotati"); S.stack=[]; return go(S.user?"home":"accesso", false); }
      if(x==="mail"){ S.mail=!S.mail; return back(); }
      if(x==="pc"){ S.pc=!S.pc; return back(); }
      if(x==="arriva"){ S.resti.filter(r=>!r.arrivata).forEach(r=>{ r.arrivata=true; S.controlli.push({id:"c"+(++S.n), t:"arrivo", to:"piani", k:r.k, txt:`Arrivato: ${r.righe.map(z=>z.q+" "+A(z.a).code).join(", ")} per l'ordine ${r.k} (resto)`}); log(`Registrata al ricevimento la merce che mancava al resto dell'ordine ${r.k}: avviso al responsabile dei piani`); });
        Object.entries(S.ordini).forEach(([k,o])=>{ if(o.ferma && /manca/.test(o.ferma)){ o.riprendi="è arrivato quello che mancava"; o.ferma=null; o.righe.forEach(r=>r.ass=r.q); log(`Arrivato il mancante: l'ordine ${k} è da riprendere`, "Ordine "+k); } }); return back(); }
      if(x==="primo"){ S.stack=[]; return go("primo", false); }
      if(x==="boss"){ S.pinFor="Anna"; S.stack=[]; return go("pin", false); }
      if(x==="piani"){ S.pinFor="Davide"; S.stack=[]; return go("pin", false); }
      if(x==="reset"){ S=initial(); return render(); }
  }
}

function sim(k){ S.sheet=null;
  if(!S.online){ S.pendingOffline++; return sheet("offline"); }
  const d=ddt();
  if(d.forn!=="Idrotecnica Nord" && !["fuori","nls","bc2","asp"].includes(k)){ S.toast={txt:"Questo esempio vale per i DDT di Idrotecnica Nord: apri il 698/00 o creane uno nuovo."}; return render(); }
  switch(k){
    case "bc": register("R110",1,"barcode"); return render();
    case "bcq": register("R110",6,"barcode, 6 letto sulla scatola"); return render();
    case "bc2": return sheet("bc2");
    case "bcx": return sheet("bcx");
    case "cs": return sheet("questo",{a:"S77"});
    case "csim": return sheet("questo",{a:"S77", warn:"Codice simile, controlla: sulla scatola «SL-7», a catalogo «SL-77»."});
    case "cdiff": return sheet("cdiff");
    case "asp": return sheet("aspetto");
    case "multi": return sheet("multi");
    case "q2": return sheet("q2");
    case "vend": register("V12",4,"barcode, 4 letto sulla scatola"); return render();
    case "fuori": return sheet("fuori",{k: d.forn==="Idrotecnica Nord" ? "N55" : "V12"});
    case "unit": return sheet("unit");
    case "nls": S.manoBc=true; return sheet("nls");
  }
}

let EV = null;
document.addEventListener("click", e => { const b=e.target.closest("[data-act]"); if(!b || b.disabled) return; EV = e; act(b.dataset.act, b); });
render();
</script>
